<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sprattelgubben på Äventyr! – Handritat Vaxkrit- & Pappersspel</title>
    <style>
      /* =========================================================================
           GRUNDLÄGGANDE SKISSBOKS- & VAXKRITSTYLING (INGA EXTERNA BEROENDEN)
           ========================================================================= */
      :root {
        --paper-bg: #fdf8ee;
        --paper-card: #fffdf7;
        --pencil-dark: #2c2724;
        --pencil-mid: #5a524c;
        --accent-yellow: #ffd166;
        --accent-green: #06d6a0;
        --accent-blue: #4cc9f0;
        --accent-pink: #ff758f;
        --accent-orange: #ff9f1c;
      }

      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--paper-bg);
        font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", "Trebuchet MS", cursive, sans-serif;
        color: var(--pencil-dark);
        touch-action: manipulation;
      }

      #gameCanvas {
        display: block;
        width: 100%;
        height: 100%;
        position: fixed;
        inset: 0;
        z-index: 1;
      }

      .ui-layer {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 14px;
      }

      .interactive {
        pointer-events: auto;
      }

      .hidden {
        display: none !important;
      }

      /* Handritade pappersrutor med kritstreck, saxklippt vit kant och skugga */
      .paper-box {
        background-color: var(--paper-card);
        border: 3.5px solid var(--pencil-dark);
        border-radius: 24px 12px 26px 14px / 14px 26px 12px 24px;
        box-shadow:
          0 0 0 4px #ffffff,
          5px 6px 0 rgba(44, 39, 36, 0.24);
      }

      .crayon-btn {
        background-color: var(--paper-card);
        border: 3.5px solid var(--pencil-dark);
        border-radius: 22px 14px 24px 12px / 12px 24px 14px 22px;
        box-shadow:
          0 0 0 3px #ffffff,
          4px 5px 0 rgba(44, 39, 36, 0.28);
        cursor: pointer;
        transition:
          transform 0.08s ease,
          box-shadow 0.08s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: inherit;
        font-weight: 800;
        color: var(--pencil-dark);
      }

      .crayon-btn:active {
        transform: translate(3px, 4px) scale(0.97);
        box-shadow:
          0 0 0 3px #ffffff,
          1px 1px 0 rgba(44, 39, 36, 0.28);
      }

      .top-hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        flex-wrap: wrap;
      }

      .hud-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .hud-pill {
        padding: 7px 13px;
        font-size: clamp(0.95rem, 2.4vw, 1.25rem);
        font-weight: 900;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .icon-btn {
        width: 46px;
        height: 46px;
        font-size: 1.3rem;
        border-radius: 50%;
      }

      .controls-hud {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        width: 100%;
        padding-bottom: max(6px, env(safe-area-inset-bottom));
      }

      .action-pad {
        width: clamp(112px, 24vw, 165px);
        height: clamp(86px, 16vh, 120px);
        font-size: clamp(1.2rem, 3.2vw, 1.65rem);
        flex-direction: column;
        gap: 2px;
      }

      .pad-duck {
        background-color: #ffe5ec;
      }
      .pad-jump {
        background-color: #d8f3dc;
      }

      .start-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(253, 248, 238, 0.90);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        overflow-y: auto;
      }

      .menu-deco-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        opacity: 0.38;
      }

      .start-card {
        position: relative;
        z-index: 1;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
      }

      .menu-game-title {
        font-size: clamp(2.2rem, 7vw, 3.8rem) !important;
        color: #ff595e;
        text-shadow: 3px 3px 0 #ffd166, 0 5px 14px rgba(44, 39, 36, 0.18) !important;
        letter-spacing: 0.01em;
        line-height: 1.0;
      }

      .menu-logo {
        display: block;
        width: 100%;
        max-width: min(90vw, 770px);
        margin: 0 auto clamp(20px, 4vw, 36px);
        filter: drop-shadow(3px 5px 0px rgba(44, 39, 36, 0.35))
                drop-shadow(0px 3px 10px rgba(44, 39, 36, 0.18));
      }

      /* Karaktärsknappar: frilagda figurer utan ram */
      #charPicker .char-chip {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        width: clamp(120px, 24vw, 200px);
        height: clamp(120px, 24vw, 200px);
        padding: 2px;
        transition: transform 0.12s ease;
      }
      #charPicker .char-chip.active {
        background: transparent !important;
        transform: scale(1.15) rotate(-2deg) !important;
        filter: none !important;
      }
      #charPicker .char-thumb {
        width: 100%;
        height: 100%;
        filter: url(#charThumbCutout);
      }
      #charPicker {
        gap: clamp(8px, 3vw, 22px);
        margin-bottom: clamp(18px, 4vw, 34px);
      }

      /* Overlay-canvas för bubbel-indikator (full opacitet, ovanpå kortet) */
      .char-active-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
      }

      .start-card {
        max-width: min(96vw, 960px);
        width: 100%;
        padding: clamp(16px, 4vw, 40px);
        text-align: center;
        position: relative;
      }

      .tape-strip {
        position: absolute;
        top: -13px;
        left: 50%;
        transform: translateX(-50%) rotate(-2deg);
        width: 125px;
        height: 26px;
        background: rgba(244, 226, 156, 0.9);
        border: 2px dashed rgba(90, 82, 76, 0.45);
      }

      .game-title {
        font-size: clamp(1.7rem, 5vw, 2.75rem);
        font-weight: 900;
        line-height: 1.08;
        margin-top: 4px;
        margin-bottom: 4px;
        text-shadow: 2px 2px 0 #ffd166;
      }

      .subtitle {
        font-size: clamp(0.95rem, 2.4vw, 1.15rem);
        color: var(--pencil-mid);
        margin-bottom: 12px;
        font-weight: 700;
      }

      .section-label {
        font-size: 0.92rem;
        font-weight: 900;
        margin-bottom: 6px;
        color: var(--pencil-mid);
      }

      .picker-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 7px;
        margin-bottom: 12px;
      }

      .choice-chip {
        padding: 6px 12px;
        font-size: 0.92rem;
        background: #fffdf7;
      }

      .choice-chip.active {
        background: var(--accent-yellow);
        transform: scale(1.06) rotate(-1deg);
      }

      /* Karaktärsknapparna visar själva SVG-figuren som miniatyr. */
      .char-chip {
        padding: 4px;
        width: 72px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .char-thumb {
        width: 60px;
        height: 60px;
        display: block;
        pointer-events: none;
        object-fit: contain;
      }

      .color-dot {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid var(--pencil-dark);
        box-shadow: 0 0 0 2px #ffffff;
        cursor: pointer;
        transition: transform 0.1s ease;
      }

      .color-dot.active {
        transform: scale(1.22);
        box-shadow:
          0 0 0 3px #ffffff,
          0 0 0 6px var(--pencil-dark);
      }

      .play-big-btn {
        background: linear-gradient(180deg, #52b788 0%, #2d936c 100%);
        color: #ffffff;
        font-size: clamp(2rem, 6vw, 3.2rem);
        padding: clamp(16px, 4vw, 28px) clamp(44px, 10vw, 90px);
        margin-top: 4px;
        text-shadow: 2px 2px 0 #1b4332;
      }

      .poop-start-btn {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        cursor: pointer;
        padding: 0;
        margin: clamp(10px, 3vw, 20px) auto 0;
        display: block;
        transition: transform 0.12s ease;
      }
      .poop-start-btn:hover {
        transform: scale(1.08) rotate(-3deg);
      }
      .poop-start-btn:active {
        transform: scale(0.94) rotate(2deg);
      }
      #poopBtnCanvas {
        display: block;
        pointer-events: none;
        width: clamp(200px, 38vw, 360px);
        height: clamp(220px, 42vw, 400px);
      }

      .world-banner {
        position: fixed;
        top: 22%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-2deg);
        z-index: 15;
        padding: 14px 28px;
        font-size: clamp(1.4rem, 4vw, 2.2rem);
        font-weight: 900;
        background: var(--accent-yellow);
        pointer-events: none;
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
      }

      .world-banner.hidden-banner {
        opacity: 0;
        transform: translate(-50%, -65%) scale(0.85) rotate(-2deg);
      }

      /* Målskärm vid godiskiosken mellan banorna */
      .kiosk-overlay {
        position: fixed;
        inset: 0;
        z-index: 25;
        background: rgba(253, 248, 238, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .kiosk-card {
        max-width: 520px;
        width: 100%;
        padding: 24px;
        text-align: center;
        position: relative;
        background: #fffdf7;
      }

      .candy-row {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin: 16px 0;
        flex-wrap: wrap;
      }

      .candy-btn {
        font-size: 2.2rem;
        padding: 12px 18px;
        background: #ffe5ec;
        flex-direction: column;
        gap: 4px;
      }

      .candy-btn span.candy-label {
        font-size: 0.9rem;
      }

      /* Kylskåpsmagnet-tavla i godiskiosken & på startskärmen */
      .fridge-board {
        background: #e0fbfc;
        border: 3px dashed var(--pencil-dark);
        border-radius: 18px;
        padding: 10px 14px;
        margin: 10px auto 6px;
        max-width: 380px;
      }

      .magnet-slots {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin-top: 6px;
      }

      .magnet-slot {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        border: 3px dashed #8d99ae;
        background: rgba(255, 255, 255, 0.65);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.9rem;
        transition: transform 0.25s ease;
      }

      .magnet-slot.earned {
        border: 3px solid var(--pencil-dark);
        background: #fffdf7;
        box-shadow:
          0 0 0 3px #ffffff,
          3px 4px 0 rgba(44, 39, 36, 0.25);
        transform: rotate(-4deg) scale(1.06);
      }

      .magnet-slot.earned:nth-child(2) {
        transform: rotate(5deg) scale(1.06);
      }

      .unicorn-chip {
        background: linear-gradient(135deg, #ffccd5 0%, #cdb4db 50%, #bde0fe 100%) !important;
      }

      /* =========================================================
         PUPPET-LAGRET (inline SVG över canvasen)
         ========================================================= */
      #puppetLayer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
        z-index: 2;
      }
      #skateCanvas {
        display: block;
        width: 100%;
        height: 100%;
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }
      .puppet-wrapper {
        position: absolute;
        width: 320px;
        height: 320px;
        overflow: visible;
        transform-origin: 160px 282px;
        transform: scale(0.55);
        will-change: transform, left, top;
        filter: url(#puppetPaperCutout);
      }
      .puppet-wrapper svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        display: block;
      }

      /* =========================================================
         EXAKT RIGG & LEDER (viewBox="0 0 320 320")
         ========================================================= */
      .puppet-wrapper #flip-wrapper,
      .puppet-wrapper #character-front,
      .puppet-wrapper #front-torso-group,
      .puppet-wrapper #front-tailOrCape,
      .puppet-wrapper #front-head,
      .puppet-wrapper #front-armLeft,
      .puppet-wrapper #front-armRight,
      .puppet-wrapper #front-legLeft,
      .puppet-wrapper #front-legRight,
      .puppet-wrapper #character-side,
      .puppet-wrapper #side-torso-group,
      .puppet-wrapper #side-tailOrCape,
      .puppet-wrapper #side-head,
      .puppet-wrapper #side-armBack,
      .puppet-wrapper #side-armFront,
      .puppet-wrapper #side-legBack,
      .puppet-wrapper #side-legFront {
        transform-box: view-box;
      }

      /* Visa framifrån vid idle, sidoprofil vid rörelse */
      .puppet-wrapper #character-front { display: none; }
      .puppet-wrapper #character-side  { display: inline; }
      .puppet-wrapper.anim-idle #character-front { display: inline; }
      .puppet-wrapper.anim-idle #character-side  { display: none; }

      /* Spegelvändning höger / vänster */
      .puppet-wrapper #flip-wrapper {
        transform-origin: 160px 160px;
      }
      .puppet-wrapper.facing-left #flip-wrapper {
        transform: scaleX(-1);
      }

      /* Exakta rotationspunkter – FRAMIFRÅN */
      .puppet-wrapper #character-front   { transform-origin: 160px 175px; }
      .puppet-wrapper #front-torso-group { transform-origin: 160px 175px; }
      .puppet-wrapper #front-head        { transform-origin: 160px 130px; }
      .puppet-wrapper #front-tailOrCape  { transform-origin: 160px 180px; }
      .puppet-wrapper #front-armLeft     { transform-origin: 128px 150px; }
      .puppet-wrapper #front-armRight    { transform-origin: 192px 150px; }
      .puppet-wrapper #front-legLeft     { transform-origin: 143px 208px; }
      .puppet-wrapper #front-legRight    { transform-origin: 177px 208px; }

      /* Exakta rotationspunkter – SIDOPROFIL */
      .puppet-wrapper #character-side    { transform-origin: 165px 175px; }
      .puppet-wrapper #side-torso-group  { transform-origin: 165px 175px; }
      .puppet-wrapper #side-head         { transform-origin: 165px 130px; }
      .puppet-wrapper #side-tailOrCape   { transform-origin: 140px 180px; }
      .puppet-wrapper #side-armFront     { transform-origin: 164px 148px; }
      .puppet-wrapper #side-armBack      { transform-origin: 164px 148px; }
      .puppet-wrapper #side-legFront     { transform-origin: 162px 208px; }
      .puppet-wrapper #side-legBack      { transform-origin: 162px 208px; }

      /* =========================================================
         1. STÅ (IDLE – FRAMIFRÅN)
         ========================================================= */
      .puppet-wrapper.anim-idle #front-torso-group { animation: puppetIdleBreathe 2.6s ease-in-out infinite; }
      .puppet-wrapper.anim-idle #front-head        { animation: puppetIdleHead 3.4s ease-in-out infinite; }
      .puppet-wrapper.anim-idle #front-tailOrCape  { animation: puppetIdleTail 2.4s ease-in-out infinite; }
      .puppet-wrapper.anim-idle #front-armLeft     { animation: puppetIdleArmL 2.6s ease-in-out infinite; }
      .puppet-wrapper.anim-idle #front-armRight    { animation: puppetIdleArmR 2.6s ease-in-out infinite; }

      @keyframes puppetIdleBreathe {
        0%, 100% { transform: translateY(0px) scaleY(1); }
        50%      { transform: translateY(-2.5px) scaleY(1.022); }
      }
      @keyframes puppetIdleHead {
        0%, 100% { transform: rotate(-3deg); }
        50%      { transform: rotate(3.5deg); }
      }
      @keyframes puppetIdleTail {
        0%, 100% { transform: rotate(-3deg); }
        50%      { transform: rotate(4deg); }
      }
      @keyframes puppetIdleArmL {
        0%, 100% { transform: rotate(4deg); }
        50%      { transform: rotate(12deg); }
      }
      @keyframes puppetIdleArmR {
        0%, 100% { transform: rotate(-4deg); }
        50%      { transform: rotate(-12deg); }
      }

      /* =========================================================
         2. SPRINGA (RUN – SIDOPROFIL)
         ========================================================= */
      .puppet-wrapper.anim-run #character-side { animation: puppetRunBody 0.56s ease-in-out infinite; }
      .puppet-wrapper.anim-run #side-head      { animation: puppetRunHead 0.56s ease-in-out infinite; }
      .puppet-wrapper.anim-run #side-tailOrCape{ animation: puppetRunTail 0.34s ease-in-out infinite; }
      .puppet-wrapper.anim-run #side-armFront  { animation: puppetRunArmF 0.56s ease-in-out infinite; }
      .puppet-wrapper.anim-run #side-armBack   { animation: puppetRunArmB 0.56s ease-in-out infinite; }
      .puppet-wrapper.anim-run #side-legFront  { animation: puppetRunLegF 0.56s ease-in-out infinite; }
      .puppet-wrapper.anim-run #side-legBack   { animation: puppetRunLegB 0.56s ease-in-out infinite; }

      /* Balanserar på sköldpadda – sidovy, inga benrörelser */
      .puppet-wrapper.anim-balance #character-side    { display: inline; }
      .puppet-wrapper.anim-balance #character-front   { display: none; }

      @keyframes puppetRunBody {
        0%, 100% { transform: translateY(1px) rotate(10deg) scale(1.03, 0.97); }
        25%      { transform: translateY(-15px) rotate(12deg) scale(0.97, 1.04); }
        50%      { transform: translateY(1px) rotate(9deg) scale(1.03, 0.97); }
        75%      { transform: translateY(-15px) rotate(12deg) scale(0.97, 1.04); }
      }
      @keyframes puppetRunHead {
        0%, 100% { transform: rotate(-9deg); }
        50%      { transform: rotate(-3deg) translateY(-2px); }
      }
      @keyframes puppetRunTail {
        0%, 100% { transform: rotate(8deg); }
        50%      { transform: rotate(22deg); }
      }
      @keyframes puppetRunArmF {
        0%, 100% { transform: rotate(-52deg); }
        50%      { transform: rotate(46deg); }
      }
      @keyframes puppetRunArmB {
        0%, 100% { transform: rotate(46deg); }
        50%      { transform: rotate(-52deg); }
      }
      @keyframes puppetRunLegF {
        0%, 100% { transform: rotate(42deg); }
        50%      { transform: rotate(-42deg); }
      }
      @keyframes puppetRunLegB {
        0%, 100% { transform: rotate(-42deg); }
        50%      { transform: rotate(42deg); }
      }

      /* =========================================================
         3. HOPPA (JUMP – SIDOPROFIL)
         ========================================================= */
      .puppet-wrapper.anim-jump #character-side { animation: puppetJumpBody 1.18s cubic-bezier(0.36, 0, 0.28, 1) infinite; }
      .puppet-wrapper.anim-jump #side-head      { animation: puppetJumpHead 1.18s ease-in-out infinite; }
      .puppet-wrapper.anim-jump #side-tailOrCape{ animation: puppetJumpTail 1.18s ease-in-out infinite; }
      .puppet-wrapper.anim-jump #side-armFront  { animation: puppetJumpArmF 1.18s ease-in-out infinite; }
      .puppet-wrapper.anim-jump #side-armBack   { animation: puppetJumpArmB 1.18s ease-in-out infinite; }
      .puppet-wrapper.anim-jump #side-legFront  { animation: puppetJumpLegF 1.18s ease-in-out infinite; }
      .puppet-wrapper.anim-jump #side-legBack   { animation: puppetJumpLegB 1.18s ease-in-out infinite; }

      @keyframes puppetJumpBody {
        0%, 100% { transform: translateY(0px) rotate(0deg) scale(1, 1); }
        18%      { transform: translateY(12px) rotate(7deg) scale(1.12, 0.86); }
        48%      { transform: translateY(-58px) rotate(-5deg) scale(0.93, 1.08); }
        78%      { transform: translateY(10px) rotate(6deg) scale(1.13, 0.87); }
        90%      { transform: translateY(-2px) rotate(0deg) scale(0.98, 1.02); }
      }
      @keyframes puppetJumpHead {
        0%, 100% { transform: rotate(0deg); }
        18%      { transform: rotate(-6deg); }
        48%      { transform: rotate(-12deg) translateY(-2px); }
        78%      { transform: rotate(6deg); }
      }
      @keyframes puppetJumpTail {
        0%, 100% { transform: rotate(0deg); }
        48%      { transform: rotate(26deg); }
      }
      @keyframes puppetJumpArmF {
        0%, 100% { transform: rotate(10deg); }
        18%      { transform: rotate(50deg); }
        48%      { transform: rotate(-138deg); }
        78%      { transform: rotate(24deg); }
      }
      @keyframes puppetJumpArmB {
        0%, 100% { transform: rotate(-8deg); }
        18%      { transform: rotate(40deg); }
        48%      { transform: rotate(-124deg); }
        78%      { transform: rotate(12deg); }
      }
      @keyframes puppetJumpLegF {
        0%, 100% { transform: rotate(0deg); }
        18%      { transform: rotate(-22deg); }
        48%      { transform: rotate(-32deg); }
        78%      { transform: rotate(-14deg); }
      }
      @keyframes puppetJumpLegB {
        0%, 100% { transform: rotate(0deg); }
        18%      { transform: rotate(20deg); }
        48%      { transform: rotate(30deg); }
        78%      { transform: rotate(16deg); }
      }

      /* =========================================================
         4. SIMMA (SWIM – SIDOPROFIL)
         ========================================================= */
      .puppet-wrapper.anim-swim #character-side { animation: puppetSwimFloat 1.9s ease-in-out infinite; }
      .puppet-wrapper.anim-swim #side-head      { animation: puppetSwimHead 1.9s ease-in-out infinite; }
      .puppet-wrapper.anim-swim #side-tailOrCape{ animation: puppetSwimTail 0.75s ease-in-out infinite; }
      .puppet-wrapper.anim-swim #side-armFront  { animation: puppetSwimArmF 1.15s ease-in-out infinite; }
      .puppet-wrapper.anim-swim #side-armBack   { animation: puppetSwimArmB 1.15s ease-in-out infinite; }
      .puppet-wrapper.anim-swim #side-legFront  { animation: puppetSwimLegF 0.58s ease-in-out infinite; }
      .puppet-wrapper.anim-swim #side-legBack   { animation: puppetSwimLegB 0.58s ease-in-out infinite; }

      @keyframes puppetSwimFloat {
        0%, 100% { transform: translate(0px, -16px) rotate(76deg); }
        50%      { transform: translate(10px, -4px) rotate(82deg); }
      }
      @keyframes puppetSwimHead {
        0%, 100% { transform: rotate(-42deg); }
        50%      { transform: rotate(-32deg); }
      }
      @keyframes puppetSwimTail {
        0%, 100% { transform: rotate(-10deg); }
        50%      { transform: rotate(16deg); }
      }
      @keyframes puppetSwimArmF {
        0%, 100% { transform: rotate(-134deg); }
        50%      { transform: rotate(24deg); }
      }
      @keyframes puppetSwimArmB {
        0%, 100% { transform: rotate(24deg); }
        50%      { transform: rotate(-134deg); }
      }
      @keyframes puppetSwimLegF {
        0%, 100% { transform: rotate(24deg); }
        50%      { transform: rotate(-22deg); }
      }
      @keyframes puppetSwimLegB {
        0%, 100% { transform: rotate(-22deg); }
        50%      { transform: rotate(24deg); }
      }

      /* =========================================================
         5. VOLT (DOUBLE-JUMP FLIP – SIDOPROFIL)
         ========================================================= */
      .puppet-wrapper.anim-flip #character-side  { animation: puppetFlipBody 0.57s linear infinite; }
      .puppet-wrapper.anim-flip #side-head       { transform: rotate(-10deg); }
      .puppet-wrapper.anim-flip #side-armFront   { transform: rotate(-120deg); }
      .puppet-wrapper.anim-flip #side-armBack    { transform: rotate(-120deg); }
      .puppet-wrapper.anim-flip #side-legFront   { transform: rotate(70deg); }
      .puppet-wrapper.anim-flip #side-legBack    { transform: rotate(-60deg); }
      .puppet-wrapper.anim-flip #side-tailOrCape { transform: rotate(-30deg); }

      @keyframes puppetFlipBody {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      /* =========================================================
         6. BAKÅTVOLT (BANANA SLIP – SIDOPROFIL)
         ========================================================= */
      .puppet-wrapper.anim-backflip #character-side  { animation: puppetBackflipBody 0.57s linear infinite; }
      .puppet-wrapper.anim-backflip #side-head       { transform: rotate(-20deg); }
      .puppet-wrapper.anim-backflip #side-armFront   { transform: rotate(80deg); }
      .puppet-wrapper.anim-backflip #side-armBack    { transform: rotate(60deg); }
      .puppet-wrapper.anim-backflip #side-legFront   { transform: rotate(-50deg); }
      .puppet-wrapper.anim-backflip #side-legBack    { transform: rotate(50deg); }
      .puppet-wrapper.anim-backflip #side-tailOrCape { transform: rotate(40deg); }

      @keyframes puppetBackflipBody {
        from { transform: rotate(0deg); }
        to   { transform: rotate(-360deg); }
      }

      /* =========================================================
         7. SITTER PÅ RUMPAN (BANANA SIT – SIDOPROFIL)
         ========================================================= */
      /* translateY är i viewBox-enheter (320×320), inte skärmpixlar. Vi skalar
         wrappern med 0.42 → 52 viewBox-enheter ≈ 22 skärmpixlar nedåt
         (samma visuella offset som den procedurella sitOffsetY). */
      .puppet-wrapper.anim-sit #side-torso-group { transform: translateY(52px) rotate(-12deg); }
      .puppet-wrapper.anim-sit #side-head        { transform: rotate(10deg); }
      .puppet-wrapper.anim-sit #side-legFront    { transform: rotate(-82deg); }
      .puppet-wrapper.anim-sit #side-legBack     { transform: rotate(-76deg); }
      .puppet-wrapper.anim-sit #side-tailOrCape  { transform: rotate(-20deg); }
      .puppet-wrapper.anim-sit #side-armFront    { animation: puppetSitArmF 0.085s ease-in-out infinite alternate; }
      .puppet-wrapper.anim-sit #side-armBack     { animation: puppetSitArmB 0.085s ease-in-out infinite alternate; }

      @keyframes puppetSitArmF {
        from { transform: rotate(-54deg); }
        to   { transform: rotate(54deg); }
      }
      @keyframes puppetSitArmB {
        from { transform: rotate(54deg); }
        to   { transform: rotate(-54deg); }
      }

      /* =========================================================
         8. HOPPLADDNING (BUILDUP – SIDOKROPP + FRAMIFRÅN-HUVUD)
         Figuren fortsätter springa i sidoprofil, men huvudet vänds
         mot spelaren med en förtvivlad, skakande min.
         ========================================================= */
      /* Visa både vyer: sido-kroppen springer vidare, front-huvudet
         läggs ovanpå (sido-huvudet göms så det inte blir dubbletter). */
      .puppet-wrapper.anim-buildup #character-front { display: inline; }
      .puppet-wrapper.anim-buildup #character-side  { display: inline; }

      /* Göm ALLT i front-vyn utom huvudet — vi vill bara ha ansiktet. */
      .puppet-wrapper.anim-buildup #front-torso-group > *:not(#front-head) { display: none; }

      /* Göm sido-huvudet så front-huvudet tar dess plats. */
      .puppet-wrapper.anim-buildup #side-head { display: none; }

      /* Sido-kroppen fortsätter sin spring-cykel. */
      .puppet-wrapper.anim-buildup #character-side    { animation: puppetRunBody 0.56s ease-in-out infinite; }
      .puppet-wrapper.anim-buildup #side-tailOrCape   { animation: puppetRunTail 0.34s ease-in-out infinite; }
      .puppet-wrapper.anim-buildup #side-armFront     { animation: puppetRunArmF 0.56s ease-in-out infinite; }
      .puppet-wrapper.anim-buildup #side-armBack      { animation: puppetRunArmB 0.56s ease-in-out infinite; }
      .puppet-wrapper.anim-buildup #side-legFront     { animation: puppetRunLegF 0.56s ease-in-out infinite; }
      .puppet-wrapper.anim-buildup #side-legBack      { animation: puppetRunLegB 0.56s ease-in-out infinite; }

      /* Front-huvudet skakar snabbt av nervositet / förtvivlan. */
      .puppet-wrapper.anim-buildup #front-head {
        animation: puppetBuildupHeadShake 0.14s ease-in-out infinite;
      }

      @keyframes puppetBuildupHeadShake {
        0%, 100% { transform: rotate(-5deg) translateY(1px); }
        25%      { transform: rotate(6deg)  translateY(-1px); }
        50%      { transform: rotate(-5deg) translateY(1px); }
        75%      { transform: rotate(6deg)  translateY(-1px); }
      }

      /* =========================================================
         DEV-PANEL för papperskant & skugga
         ========================================================= */
      #devToggleBtn {
        position: fixed;
        top: 10px;
        right: 10px;
        width: 40px;

        border-radius: 50%;

    <script>
      /**
       * =========================================================================
       * 1. LJUDMOTOR (WEB AUDIO API – PRUTTAR, DJURLÄTEN & AMBIENS)
       * =========================================================================
       */
      class CrayonSoundEngine {
        constructor() {
          this.ctx = null;
          this.muted = false;
          this.ambientTimer = null;
          this.musicTimer = null;
          this.musicStep = 0;
          this.fartBuffers = { squeak: [], tuba: [], normal: [], all: [] };
          this.fartsLoading = false;
          this.lastFartBuffer = null;
          this.buildupBuffer = null;
          this.buildupSource = null;
          this.buildupGain = null;
          this.balloonBuffer = null;
          this.bananaBuffer = null;
        }

        init() {
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === "suspended") {
              this.ctx.resume();
            }
            this.loadFartSounds();
          } catch (e) {}
        }

        loadFartSounds() {
          if (!this.ctx || this.fartsLoading || this.fartBuffers.all.length) return;
          this.fartsLoading = true;
          // Short/snappy files = squeak, long files = tuba, mid = normal.
          const files = [
            { url: "assets/audio/Prutt A.wav", style: "squeak" },
            { url: "assets/audio/Prutt C.wav", style: "squeak" },
            { url: "assets/audio/Prutt D.wav", style: "tuba" },
            { url: "assets/audio/Prutt E.wav", style: "normal" },
            { url: "assets/audio/Prutt in stereo.wav", style: "normal" },
          ];
          files.forEach((f) => {
            fetch(f.url)
              .then((r) => r.arrayBuffer())
              .then((buf) => new Promise((res, rej) => this.ctx.decodeAudioData(buf, res, rej)))
              .then((audioBuf) => {
                this.fartBuffers[f.style].push(audioBuf);
                this.fartBuffers.all.push(audioBuf);
              })
              .catch(() => {});
          });
          const oneShots = [
            { url: "assets/audio/buildup.wav", key: "buildupBuffer" },
            { url: "assets/audio/Balloon.wav", key: "balloonBuffer" },
            { url: "assets/audio/Banana.wav", key: "bananaBuffer" },
          ];
          oneShots.forEach((o) => {
            fetch(o.url)
              .then((r) => r.arrayBuffer())
              .then((buf) => new Promise((res, rej) => this.ctx.decodeAudioData(buf, res, rej)))
              .then((audioBuf) => {
                this[o.key] = audioBuf;
              })
              .catch(() => {});
          });
        }

        playSample(buffer, volume = 0.9) {
          if (this.muted || !this.ctx || !buffer) return;
          try {
            const src = this.ctx.createBufferSource();
            src.buffer = buffer;
            const gain = this.ctx.createGain();
            gain.gain.value = volume;
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
          } catch (e) {}
        }

        playBalloon() {
          this.init();
          this.playSample(this.balloonBuffer, 1.6);
        }

        playBanana() {
          this.init();
          this.playSample(this.bananaBuffer, 3.0);
        }

        startBuildup() {
          if (this.muted) return;
          this.init();
          if (!this.ctx || !this.buildupBuffer || this.buildupSource) return;
          try {
            const src = this.ctx.createBufferSource();
            src.buffer = this.buildupBuffer;
            const gain = this.ctx.createGain();
            gain.gain.value = 2.8;
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
            this.buildupSource = src;
            this.buildupGain = gain;
            src.onended = () => {
              if (this.buildupSource === src) {
                this.buildupSource = null;
                this.buildupGain = null;
              }
            };
          } catch (e) {}
        }

        stopBuildup() {
          if (!this.buildupSource) return;
          try {
            const now = this.ctx.currentTime;
            this.buildupGain.gain.cancelScheduledValues(now);
            this.buildupGain.gain.setValueAtTime(this.buildupGain.gain.value, now);
            this.buildupGain.gain.linearRampToValueAtTime(0.0001, now + 0.05);
            this.buildupSource.stop(now + 0.06);
          } catch (e) {}
          this.buildupSource = null;
          this.buildupGain = null;
        }

        toggleMute() {
          this.muted = !this.muted;
          return this.muted;
        }

        playJump() {

            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);

        playFart(style = "normal") {
          if (this.muted) return;

          if (!this.ctx) return;
          try {
            const pool = this.fartBuffers[style]?.length

            if (!pool.length) return;
            let buf = pool[Math.floor(Math.random() * pool.length)];
            if (pool.length > 1 && buf === this.lastFartBuffer) {

            const melody = [
              523.25, 0, 659.25, 587.33, 523.25, 0, 392.0, 0, 440.0, 0, 523.25, 440.0, 392.0, 0, 0, 0, 523.25, 587.33, 659.25, 783.99,
              659.25, 0, 587.33, 0, 659.25, 523.25, 587.33, 493.88, 523.25, 0, 0, 0,
            ];

              0, 0, 0,

            const idx = this.musicStep % melody.length;

            }

      let crayonPattern = null;
      function createCrayonPattern() {
        const pCanvas = document.createElement("canvas");
        pCanvas.width = 96;
        pCanvas.height = 96;
        const pCtx = pCanvas.getContext("2d");

        pCtx.strokeStyle = "rgba(255, 255, 255, 0.24)";
        pCtx.lineWidth = 2.2;
        for (let i = -96; i < 192; i += 6) {
          pCtx.beginPath();
          pCtx.moveTo(i, 0);
          pCtx.lineTo(i + 96, 96);
          pCtx.stroke();
        }

        pCtx.fillStyle = "rgba(44, 39, 36, 0.045)";
        for (let i = 0; i < 160; i++) {
          pCtx.fillRect((i * 37) % 96, (i * 53) % 96, 2, 2);
        }
        return ctx.createPattern(pCanvas, "repeat");
      }

      const cutoutCanvas = document.createElement("canvas");
      const cutoutCtx = cutoutCanvas.getContext("2d");
      const whiteMaskCanvas = document.createElement("canvas");
      const whiteMaskCtx = whiteMaskCanvas.getContext("2d");
      const shadowMaskCanvas = document.createElement("canvas");
      const shadowMaskCtx = shadowMaskCanvas.getContext("2d");

      // Globala papperskant- och skugginställningar (styrs via dev-panelen).
      // "playerEdge" används inte av canvas-ritningen (spelaren renderas med
      // DOM/SVG-filtret puppetPaperCutout) — värdet spegas bara dit vid ändring.
      const PAPER = {
        playerEdge: 10,
        objectsEdge: 4.5,
        shadowOpacity: 0.5,
        softShadowOpacity: 0.06,
        shadowOffsetX: -3,
        shadowOffsetY: 0,
        softShadowOffsetX: 0.5,
        softShadowOffsetY: 3.5,
      };

      const paperCutoutCache = new Map();

      /**
       * Ritar en figur som ett äkta, ojämnt saxklippt pappersurklipp med kritvit ram & autentisk pappersskugga.
       * cacheKey: sträng → rendera en gång, återanvänd som sprite. undefined → rendera varje gång.
       */
      function drawWithPaperCutout(drawFn, boundsW = 220, boundsH = 220, originX = 110, originY = 110, tCtx = ctx, cacheKey = undefined) {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const lw = Math.max(240, boundsW);
        const lh = Math.max(240, boundsH);

        if (cacheKey !== undefined) {
          let cached = paperCutoutCache.get(cacheKey);
          if (!cached) {
            cached = document.createElement('canvas');
            cached.width = lw * dpr;
            cached.height = lh * dpr;
            const cCtx = cached.getContext('2d');
            cCtx.scale(dpr, dpr);
            cCtx.translate(originX, originY);
            _pcRender(drawFn, lw, lh, dpr, originX, originY, cCtx);
            paperCutoutCache.set(cacheKey, cached);
          }
          tCtx.drawImage(cached, -originX, -originY, lw, lh);
          return;
        }

        _pcRender(drawFn, lw, lh, dpr, originX, originY, tCtx);
      }

      function _pcRender(drawFn, lw, lh, dpr, originX, originY, tCtx) {
        const w = lw * dpr;
        const h = lh * dpr;
        if (cutoutCanvas.width !== w || cutoutCanvas.height !== h) {
          cutoutCanvas.width = w;
          cutoutCanvas.height = h;
          whiteMaskCanvas.width = w;
          whiteMaskCanvas.height = h;
          shadowMaskCanvas.width = w;
          shadowMaskCanvas.height = h;
        }

        cutoutCtx.clearRect(0, 0, w, h);
        cutoutCtx.save();
        cutoutCtx.scale(dpr, dpr);
        cutoutCtx.translate(originX, originY);
        drawFn(cutoutCtx);
        cutoutCtx.restore();
        // Bygg en solid kritvit saxklippt papperssilhuett med mjuk, lätt ojämn saxkant
        whiteMaskCtx.clearRect(0, 0, w, h);
        whiteMaskCtx.save();
        whiteMaskCtx.scale(dpr, dpr);
        whiteMaskCtx.globalCompositeOperation = "source-over";
        const radius = PAPER.objectsEdge;
        const steps = 16;
        for (let i = 0; i < steps; i++) {
          const a = (i / steps) * Math.PI * 2;
          const snippedR = radius + Math.sin(a * 3) * 1.1 + Math.cos(a * 5) * 0.6;
          whiteMaskCtx.drawImage(cutoutCanvas, Math.cos(a) * snippedR, Math.sin(a) * snippedR, lw, lh);
        }
        whiteMaskCtx.globalCompositeOperation = "source-in";
        whiteMaskCtx.fillStyle = "#ffffff";
        whiteMaskCtx.fillRect(0, 0, lw, lh);
        whiteMaskCtx.globalCompositeOperation = "source-over";
        whiteMaskCtx.restore();

        // Bygg en mjuk varm-grå pappersskugga från papperssilhuetten
        shadowMaskCtx.clearRect(0, 0, w, h);
        shadowMaskCtx.save();
        shadowMaskCtx.scale(dpr, dpr);
        shadowMaskCtx.drawImage(whiteMaskCanvas, 0, 0, lw, lh);
        shadowMaskCtx.globalCompositeOperation = "source-in";
        shadowMaskCtx.fillStyle = "#3b332e";
        shadowMaskCtx.fillRect(0, 0, lw, lh);
        shadowMaskCtx.globalCompositeOperation = "source-over";
        shadowMaskCtx.restore();

        // 1. Autentisk flerskiktad pappersskugga (mjuk spridd skugga + skarpare kontaktskugga)
        tCtx.save();
        tCtx.globalAlpha = PAPER.softShadowOpacity;
        for (let s = 0; s < 6; s++) {
          const sa = (s / 6) * Math.PI * 2;
          tCtx.drawImage(
            shadowMaskCanvas,
            -originX + PAPER.softShadowOffsetX + Math.cos(sa) * 3.5,
            -originY + PAPER.softShadowOffsetY + Math.sin(sa) * 3.5,
            lw, lh
          );
        }
        tCtx.globalAlpha = PAPER.shadowOpacity;
        tCtx.drawImage(shadowMaskCanvas, -originX + PAPER.shadowOffsetX, -originY + PAPER.shadowOffsetY, lw, lh);
        tCtx.restore();

        // 2. Subtil mörk papperskant + ogenomskinlig kritvit urklippskant
        tCtx.save();
        tCtx.globalAlpha = 0.22;
        tCtx.drawImage(shadowMaskCanvas, -originX - 0.8, -originY - 0.8, lw, lh);
        tCtx.drawImage(shadowMaskCanvas, -originX + 1.2, -originY + 1.2, lw, lh);
        tCtx.restore();
        tCtx.drawImage(whiteMaskCanvas, -originX, -originY, lw, lh);

        // 3. Själva figuren ovanpå pappersurklippet
        tCtx.drawImage(cutoutCanvas, -originX, -originY, lw, lh);
      }

      function drawHandLine(c, x1, y1, x2, y2, width = 3, color = "#2c2724") {
        c.save();
        c.strokeStyle = color;
        c.lineWidth = width;
        c.lineCap = "round";
        c.beginPath();
        c.moveTo(x1, y1);
        const mx = (x1 + x2) * 0.5 + Math.sin(x1 + y1) * 1.5;
        const my = (y1 + y2) * 0.5 + Math.cos(x2 + y2) * 1.5;
        c.quadraticCurveTo(mx, my, x2, y2);
        c.stroke();
        c.restore();
      }

      function fillRoundRect(c, x, y, w, h, r) {
        const rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
        c.beginPath();
        c.moveTo(x + rad, y);
        c.lineTo(x + w - rad, y);
        c.quadraticCurveTo(x + w, y, x + w, y + rad);
        c.lineTo(x + w, y + h - rad);
        c.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
        c.lineTo(x + rad, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - rad);
        c.lineTo(x, y + rad);
        c.quadraticCurveTo(x, y, x + rad, y);
        c.closePath();
      }

      function drawBrassFastener(c, x, y, r = 4.2) {
        c.save();
        c.fillStyle = "#f4a261";
        c.strokeStyle = "#2c2724";
        c.lineWidth = 2;
        c.beginPath();
        c.arc(x, y, r, 0, Math.PI * 2);
        c.fill();
        c.stroke();

        c.fillStyle = "#fff3b0";
        c.beginPath();
        c.arc(x - 1, y - 1, r * 0.38, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }

      // === CRABS: draw ===
      function drawCrab(crab) {
        ctx.save();
        ctx.translate(crab.x, crab.y);
        const scuttle = Math.sin(state.wobbleTime * 14 + crab.x * 0.05) * 3;
        const pinch = Math.abs(Math.sin(state.wobbleTime * 10));
        const _sF = Math.floor((Math.sin(state.wobbleTime * 14 + crab.x * 0.05) + 1) * 2) % 4;
        const _pF = Math.floor(pinch * 4) % 4;
        const _crabKey = "crab_" + _sF + "_" + _pF;

        drawWithPaperCutout(
          (c) => {
            c.strokeStyle = "#2c2724";
            c.lineWidth = 2.6;
            c.lineCap = "round";

            // Små krabben åt båda sidor
            for (const side of [-1, 1]) {
              for (let leg = 0; leg < 3; leg++) {
                const lx = side * (16 + leg * 5);
                const ly = -8 + leg * 2 + (leg % 2 === 0 ? scuttle * 0.4 : -scuttle * 0.4);
                c.beginPath();
                c.moveTo(side * 12, -10);
                c.lineTo(lx, ly);
                c.lineTo(lx + side * 4, 0);
                c.stroke();
              }
            }

            // Stora klor som kniper!
            for (const side of [-1, 1]) {
              c.save();
              c.translate(side * 18, -18);
              c.rotate(side * (0.25 - pinch * 0.22));
              c.fillStyle = "#ff595e";
              c.beginPath();
              c.arc(side * 6, -8, 9, 0.2 * Math.PI, 1.75 * Math.PI);
              c.lineTo(side * 6, -8);
              c.closePath();
              c.fill();
              c.stroke();
              c.restore();
            }

            // Krabbans runda röda skal
            c.fillStyle = "#ff595e";
            c.beginPath();
            c.ellipse(0, -12, 20, 12, 0, 0, Math.PI * 2);
            c.fill();
            if (crayonPattern) {
              c.fillStyle = crayonPattern;
              c.fill();
            }
            c.stroke();

            // Ögon på skaft
            c.beginPath();
            c.moveTo(-7, -22);
            c.lineTo(-9, -31);
            c.moveTo(7, -22);
            c.lineTo(9, -31);
            c.stroke();

            c.fillStyle = "#ffffff";
            c.beginPath();
            c.arc(-9, -32, 4.5, 0, Math.PI * 2);
            c.arc(9, -32, 4.5, 0, Math.PI * 2);
            c.fill();
            c.stroke();

            c.fillStyle = "#2c2724";
            c.beginPath();
            c.arc(-9, -32, 2, 0, Math.PI * 2);
            c.arc(9, -32, 2, 0, Math.PI * 2);
            c.fill();

            // Busig mun
            c.beginPath();
            c.arc(0, -11, 6, 0.1 * Math.PI, 0.9 * Math.PI);
            c.stroke();
          },
          96,
          72,
          48,
          56,
          ctx, _crabKey,
        );

        ctx.restore();
      }

                c.moveTo(5, -8);

            },

          );
        } else {
          // Stjärna
          ctx.rotate(Math.sin(state.wobbleTime * 4 + item.x * 0.01) * 0.16);
          drawWithPaperCutout(
            (c) => {
              c.fillStyle = "#ffd166";
              c.strokeStyle = "#2c2724";
              c.lineWidth = 2.8;
              c.beginPath();
              for (let i = 0; i < 10; i++) {
                const r = i % 2 === 0 ? 19 : 8.5;
                const a = (i * Math.PI) / 5 - Math.PI / 2;
                if (i === 0) c.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                else c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
              }
              c.closePath();
              c.fill();
              if (crayonPattern) {
                c.fillStyle = crayonPattern;
                c.fill();

              c.stroke();

              // Glatt litet ansikte i stjärnan

            68,
            68,
            34,
            34,
            ctx, "coll_star",

        }
        ctx.restore();
      }

      // === DOGS: draw ===
      function drawDog(dog) {
        ctx.save();
        ctx.translate(dog.x, dog.y);
        const isPooping = dog.poopTimer > 0 && dog.poopTimer < 0.7;
        const walkBob = isPooping ? 4 : Math.abs(Math.sin(state.wobbleTime * 11 + dog.x * 0.05)) * 4;
        const _wF = isPooping ? "p" : Math.floor(Math.abs(Math.sin(state.wobbleTime * 11 + dog.x * 0.05)) * 8) % 8;
        const _dogKey = "dog_" + dog.breed + "_" + _wF;

        drawWithPaperCutout(
          (c) => {
            c.strokeStyle = "#2c2724";
            c.lineWidth = 2.8;

            if (dog.breed === "dachshund") {
              // Lång, låg Tax
              c.fillStyle = "#bc6c25";
              fillRoundRect(c, -34, -22 + walkBob, 56, 15, 7);
              c.fill();
              if (crayonPattern) {
                c.fillStyle = crayonPattern;
                c.fill();
              }
              c.stroke();

              // Korta ben
              c.fillStyle = "#9c6644";
              fillRoundRect(c, -26, -8, 6, 8, 3);
              c.fill();
              c.stroke();
              fillRoundRect(c, 12, -8, 6, 8, 3);
              c.fill();
              c.stroke();

              // Huvud & lång nos
              c.fillStyle = "#bc6c25";
              c.beginPath();
              c.arc(-34, -24 + walkBob, 11, 0, Math.PI * 2);
              c.fill();
              c.stroke();
              fillRoundRect(c, -49, -25 + walkBob, 16, 9, 4);
              c.fill();
              c.stroke();

              // Hängande öra
              c.fillStyle = "#7f4f24";
              c.beginPath();
              c.ellipse(-29, -19 + walkBob, 5, 9, 0.2, 0, Math.PI * 2);
              c.fill();
              c.stroke();

              // Svans
              c.beginPath();
              c.moveTo(22, -19 + walkBob);
              c.lineTo(31, -28 + walkBob);
              c.stroke();
            } else if (dog.breed === "stbernard") {
              // Stor, lurvig Sankt Bernhard
              c.fillStyle = "#f8edeb";
              fillRoundRect(c, -28, -42 + walkBob, 54, 28, 12);
              c.fill();
              c.stroke();

              // Brun fläck på ryggen
              c.fillStyle = "#9c6644";
              c.beginPath();
              c.ellipse(4, -34 + walkBob, 16, 10, 0, 0, Math.PI * 2);
              c.fill();

              // Kraftiga ben
              c.fillStyle = "#f8edeb";
              fillRoundRect(c, -22, -16, 9, 16, 4);
              c.fill();
              c.stroke();
              fillRoundRect(c, 12, -16, 9, 16, 4);
              c.fill();
              c.stroke();

              // Stort huvud
              c.fillStyle = "#9c6644";
              c.beginPath();
              c.arc(-28, -42 + walkBob, 16, 0, Math.PI * 2);
              c.fill();
              c.stroke();

              c.fillStyle = "#f8edeb";
              fillRoundRect(c, -43, -41 + walkBob, 16, 12, 5);
              c.fill();
              c.stroke();
            } else if (dog.breed === "hedgehog") {
              // Söt liten igelkott i Nattvärlden
              c.fillStyle = "#6b4c11";
              fillRoundRect(c, -16, -8, 7, 8, 3);
              c.fill(); c.stroke();
              fillRoundRect(c, 6, -8, 7, 8, 3);
              c.fill(); c.stroke();
              c.fillStyle = "#8b6914";
              c.beginPath();
              c.ellipse(0, -18 + walkBob, 22, 16, 0, 0, Math.PI * 2);
              c.fill();
              if (crayonPattern) { c.fillStyle = crayonPattern; c.fill(); }
              c.stroke();
              // Taggar
              c.fillStyle = "#2c1a05";
              for (let sp = -3; sp <= 3; sp++) {
                c.beginPath();
                c.moveTo(sp * 7 - 3, -28 + walkBob);
                c.lineTo(sp * 7, -40 + walkBob);
                c.lineTo(sp * 7 + 3, -28 + walkBob);
                c.closePath();
                c.fill();
              }
              c.strokeStyle = "#2c2724"; c.lineWidth = 2.8;
              c.fillStyle = "#fefae0";
              c.beginPath();
              c.ellipse(-8, -15 + walkBob, 13, 9, 0, 0, Math.PI * 2);
              c.fill(); c.stroke();
              c.fillStyle = "#2c2724";
              c.beginPath();
              c.arc(-19, -15 + walkBob, 2.8, 0, Math.PI * 2);
              c.fill();
              c.beginPath();
              c.arc(-13, -20 + walkBob, 2.2, 0, Math.PI * 2);
              c.fill();
            } else if (dog.breed === "monkey") {
              // Lekfull apa i Österländska Trädgården
              c.fillStyle = "#a0522d";
              fillRoundRect(c, -16, -12, 7, 12, 3);
              c.fill(); c.stroke();
              fillRoundRect(c, 6, -12, 7, 12, 3);
              c.fill(); c.stroke();
              fillRoundRect(c, -20, -50 + walkBob, 40, 40, 12);
              c.fill();
              if (crayonPattern) { c.fillStyle = crayonPattern; c.fill(); }
              c.stroke();
              c.strokeStyle = "#7f4f24"; c.lineWidth = 5;
              c.beginPath();
              c.moveTo(20, -24 + walkBob);
              c.quadraticCurveTo(42, -10 + walkBob, 38, 10);
              c.stroke();
              c.strokeStyle = "#2c2724"; c.lineWidth = 2.8;
              c.fillStyle = "#a0522d";
              c.beginPath();
              c.arc(0, -55 + walkBob, 16, 0, Math.PI * 2);
              c.fill(); c.stroke();
              c.beginPath();
              c.arc(-16, -55 + walkBob, 7, 0, Math.PI * 2);
              c.arc(16, -55 + walkBob, 7, 0, Math.PI * 2);
              c.fill(); c.stroke();
              c.fillStyle = "#fde68a";
              c.beginPath();
              c.ellipse(0, -53 + walkBob, 10, 10, 0, 0, Math.PI * 2);
              c.fill(); c.stroke();
              c.fillStyle = "#2c2724";
              c.beginPath();
              c.arc(-5, -57 + walkBob, 2.2, 0, Math.PI * 2);
              c.arc(5, -57 + walkBob, 2.2, 0, Math.PI * 2);
              c.fill();
              c.beginPath();
              c.arc(0, -51 + walkBob, 2, 0, Math.PI * 2);
              c.fill();
            } else if (dog.breed === "camel") {
              // Stolt kamel i Ökenäventyret
              c.fillStyle = "#c8a86b";
              fillRoundRect(c, -30, -28, 9, 28, 4); c.fill(); c.stroke();
              fillRoundRect(c, -16, -28, 9, 28, 4); c.fill(); c.stroke();
              fillRoundRect(c, 6, -28, 9, 28, 4); c.fill(); c.stroke();
              fillRoundRect(c, 20, -28, 9, 28, 4); c.fill(); c.stroke();
              c.fillStyle = "#e9c46a";
              fillRoundRect(c, -38, -68 + walkBob, 76, 42, 18);
              c.fill();
              if (crayonPattern) { c.fillStyle = crayonPattern; c.fill(); }
              c.stroke();
              c.fillStyle = "#d4a843";
              c.beginPath();
              c.arc(0, -74 + walkBob, 22, Math.PI, 0);
              c.closePath();
              c.fill(); c.stroke();
              c.fillStyle = "#e9c46a";
              fillRoundRect(c, -44, -92 + walkBob, 18, 28, 8);
              c.fill(); c.stroke();
              c.beginPath();
              c.arc(-40, -96 + walkBob, 14, 0, Math.PI * 2);
              c.fill(); c.stroke();
              fillRoundRect(c, -54, -97 + walkBob, 16, 10, 5);
              c.fill(); c.stroke();
              c.fillStyle = "#2c2724";
              c.beginPath();
              c.arc(-44, -101 + walkBob, 2.5, 0, Math.PI * 2);
              c.fill();
              c.lineWidth = 1.6;
              [[-46,-103],[-44,-104],[-42,-103]].forEach(([ex,ey]) => {
                c.beginPath();
                c.moveTo(ex, ey + walkBob);
                c.lineTo(ex - 1, ey - 6 + walkBob);
                c.stroke();
              });
              c.lineWidth = 2.8;
              c.strokeStyle = "#c8a86b"; c.lineWidth = 4;
              c.beginPath();
              c.moveTo(38, -52 + walkBob);
              c.lineTo(46, -44 + walkBob);
              c.lineTo(46, -38 + walkBob);
              c.stroke();
              c.strokeStyle = "#2c2724"; c.lineWidth = 2.8;
            } else {
              // Fluffig rosa/vit Pudel
              c.fillStyle = "#ffccd5";
              fillRoundRect(c, -24, -32 + walkBob, 44, 20, 10);
              c.fill();
              c.stroke();

              // Smala ben med fluffbollar
              fillRoundRect(c, -18, -14, 6, 14, 3);
              c.fill();
              c.stroke();
              fillRoundRect(c, 10, -14, 6, 14, 3);
              c.fill();
              c.stroke();
              c.beginPath();
              c.arc(-15, -6, 5, 0, Math.PI * 2);
              c.arc(13, -6, 5, 0, Math.PI * 2);
              c.fill();
              c.stroke();

              // Fluffigt huvud
              c.beginPath();
              c.arc(-24, -34 + walkBob, 13, 0, Math.PI * 2);
              c.arc(-24, -45 + walkBob, 8, 0, Math.PI * 2);
              c.fill();
              c.stroke();

              // Svansboll
              c.beginPath();
              c.arc(23, -30 + walkBob, 6, 0, Math.PI * 2);
              c.fill();
              c.stroke();
            }

            // Gemensamt öga & nos (ej för varelser med egna ögon)
            if (!["hedgehog", "monkey", "camel"].includes(dog.breed)) {
              const headX = dog.breed === "dachshund" ? -38 : dog.breed === "stbernard" ? -33 : -28;
              const headY = dog.breed === "dachshund" ? -26 : dog.breed === "stbernard" ? -45 : -36;
              c.fillStyle = "#2c2724";
              c.beginPath();
              c.arc(headX, headY + walkBob, 2.5, 0, Math.PI * 2);
              c.fill();
            }
          },
          dog.breed === "camel" ? 160 : 130,
          dog.breed === "camel" ? 140 : 96,
          dog.breed === "camel" ? 80 : 65,
          dog.breed === "camel" ? 120 : 82,
          ctx, _dogKey,
        );

        ctx.restore();
      }

      // === BIRDS: draw ===
      function drawBird(bird) {
        ctx.save();
        const shudder = (bird.poopShudder > 0)
          ? Math.sin(state.wobbleTime * 55) * 5 * (bird.poopShudder / 0.55) : 0;
        ctx.translate(bird.x + shudder, bird.y);
        if (bird.poopShudder > 0)
          ctx.rotate(Math.sin(state.wobbleTime * 48) * 0.18 * (bird.poopShudder / 0.55));
        const flap = Math.sin(state.wobbleTime * 15 + bird.x * 0.04) * 14;
        const _fF = Math.floor((Math.sin(state.wobbleTime * 15 + bird.x * 0.04) + 1) * 4) % 8;
        const _birdKey = bird.poopShudder > 0 ? undefined : "bird_" + bird.species + "_" + _fF;

        if (bird.species === "owl") {
          drawWithPaperCutout(
            (c) => {
              c.strokeStyle = "#2c2724";
              c.lineWidth = 2.6;
              // Kropp
              c.fillStyle = "#a0522d";
              c.beginPath();
              c.ellipse(0, 2, 16, 20, 0, 0, Math.PI * 2);
              c.fill();
              if (crayonPattern) { c.fillStyle = crayonPattern; c.fill(); }
              c.stroke();
              // Vingar
              c.fillStyle = "#7f4f24";
              c.beginPath();
              c.moveTo(-16, 0);
              c.quadraticCurveTo(-36, -8 + flap * 0.7, -28, 14);
              c.closePath();
              c.fill();
              c.stroke();
              c.beginPath();
              c.moveTo(16, 0);
              c.quadraticCurveTo(36, -8 + flap * 0.7, 28, 14);
              c.closePath();
              c.fill();
              c.stroke();
              // Huvud
              c.fillStyle = "#a0522d";
              c.beginPath();
              c.arc(0, -18, 14, 0, Math.PI * 2);
              c.fill();
              c.stroke();
              // Örontofsar
              c.fillStyle = "#7f4f24";
              c.beginPath();
              c.moveTo(-8, -30); c.lineTo(-12, -42); c.lineTo(-2, -32); c.closePath();
              c.fill(); c.stroke();
              c.beginPath();
              c.moveTo(8, -30); c.lineTo(12, -42); c.lineTo(2, -32); c.closePath();
              c.fill(); c.stroke();
              // Stora ögon
              c.fillStyle = "#ffd166";
              c.beginPath();
              c.arc(-6, -18, 6, 0, Math.PI * 2);
              c.arc(6, -18, 6, 0, Math.PI * 2);
              c.fill(); c.stroke();
              c.fillStyle = "#2c2724";
              c.beginPath();
              c.arc(-6, -18, 3, 0, Math.PI * 2);
              c.arc(6, -18, 3, 0, Math.PI * 2);
              c.fill();
              // Näbb
              c.fillStyle = "#ff9f1c";
              c.beginPath();
              c.moveTo(-3, -11); c.lineTo(0, -6); c.lineTo(3, -11); c.closePath();
              c.fill(); c.stroke();
            },
            90, 90, 45, 50, ctx, _birdKey,
          );
        } else if (bird.species === "bat") {
          drawWithPaperCutout(
            (c) => {
              c.strokeStyle = "#2c2724";
              c.lineWidth = 2.6;
              const bf = Math.sin(state.wobbleTime * 20 + bird.x * 0.05) * 18;
              // Vänster vinge
              c.fillStyle = "#3d1f5e";
              c.beginPath();
              c.moveTo(-2, 0);
              c.quadraticCurveTo(-24, -12 + bf, -44, 4 + bf * 0.4);
              c.quadraticCurveTo(-30, 12, -14, 10);
              c.closePath();
              c.fill(); c.stroke();
              // Höger vinge
              c.beginPath();
              c.moveTo(2, 0);
              c.quadraticCurveTo(24, -12 + bf, 44, 4 + bf * 0.4);
              c.quadraticCurveTo(30, 12, 14, 10);
              c.closePath();
              c.fill(); c.stroke();
              // Kropp
              c.fillStyle = "#4a2070";
              c.beginPath();
              c.ellipse(0, 2, 10, 13, 0, 0, Math.PI * 2);
              c.fill(); c.stroke();
              // Huvud
              c.beginPath();
              c.arc(0, -10, 10, 0, Math.PI * 2);
              c.fill(); c.stroke();
              // Öron
              c.fillStyle = "#6a2d9f";
              c.beginPath();
              c.moveTo(-8, -18); c.lineTo(-13, -30); c.lineTo(-2, -20); c.closePath();
              c.fill(); c.stroke();
              c.beginPath();
              c.moveTo(8, -18); c.lineTo(13, -30); c.lineTo(2, -20); c.closePath();
              c.fill(); c.stroke();
              // Ögon
              c.fillStyle = "#ff595e";
              c.beginPath();
              c.arc(-4, -11, 2.8, 0, Math.PI * 2);
              c.arc(4, -11, 2.8, 0, Math.PI * 2);
              c.fill();
            },
            100, 80, 50, 42, ctx, _birdKey,
          );
        } else if (bird.species === "butterfly") {
          drawWithPaperCutout(
            (c) => {
              c.strokeStyle = "#2c2724";
              c.lineWidth = 2.4;
              const bf = Math.sin(state.wobbleTime * 18 + bird.x * 0.06) * 16;
              // Övre vingar
              c.fillStyle = "#ff758f";
              c.beginPath();
              c.ellipse(-18, -10 + bf * 0.5, 20, 13, -0.4, 0, Math.PI * 2);
              c.fill(); c.stroke();
              c.beginPath();
              c.ellipse(18, -10 + bf * 0.5, 20, 13, 0.4, 0, Math.PI * 2);
              c.fill(); c.stroke();
              // Undre vingar
              c.fillStyle = "#ffb7c5";
              c.beginPath();
              c.ellipse(-14, 8 - bf * 0.3, 14, 9, 0.3, 0, Math.PI * 2);
              c.fill(); c.stroke();
              c.beginPath();
              c.ellipse(14, 8 - bf * 0.3, 14, 9, -0.3, 0, Math.PI * 2);
              c.fill(); c.stroke();
              // Vingmönster
              c.fillStyle = "#ffd166";
              c.beginPath();
              c.arc(-18, -10, 5, 0, Math.PI * 2);
              c.arc(18, -10, 5, 0, Math.PI * 2);
              c.fill();
              // Kropp
              c.fillStyle = "#2c2724";
              c.beginPath();
              c.ellipse(0, 0, 3, 14, 0, 0, Math.PI * 2);
              c.fill(); c.stroke();
              // Antenner
              c.lineWidth = 1.8;
              c.beginPath();
              c.moveTo(-2, -13); c.quadraticCurveTo(-10, -26, -6, -32); c.stroke();
              c.beginPath();
              c.moveTo(2, -13); c.quadraticCurveTo(10, -26, 6, -32); c.stroke();
              c.fillStyle = "#2c2724";
              c.beginPath();
              c.arc(-6, -32, 2.5, 0, Math.PI * 2);
              c.arc(6, -32, 2.5, 0, Math.PI * 2);
              c.fill();
            },
            90, 80, 45, 42, ctx, _birdKey,

        } else {
          drawWithPaperCutout(

              c.beginPath();
              c.arc(-15, -5, 9, 0, Math.PI * 2);
              c.fill();
              c.stroke();

              c.fillStyle = beakColor;
              c.beginPath();
              c.moveTo(-23, -6);
              c.lineTo(-33, -3);
              c.lineTo(-23, 0);
              c.closePath();
              c.fill();
              c.stroke();

              c.fillStyle = bird.species === "parrot" ? "#1982c4" : bodyColor;
              c.beginPath();
              c.moveTo(-4, -3);
              c.quadraticCurveTo(4, -22 + flap, 14, -4);
              c.closePath();
              c.fill();
              c.stroke();

              c.fillStyle = "#2c2724";
              c.beginPath();
              c.arc(-17, -7, 2.2, 0, Math.PI * 2);
              c.fill();
            },
            92,
            74,

      /**
       * =========================================================================
       * 5. BAKGRUNDSVÄRLDAR, HANDRITAD SJÖ & ROLIG GODISKIOSK

      function getGroundY(h) {
        return Math.floor(h * 0.78);
      }

      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const W = window.innerWidth;
        const H = window.innerHeight;
        const oldGround = getGroundY(canvas.height ? canvas.height / dpr : H);
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.scale(dpr, dpr);
        skateCanvas.width = W * dpr;
        skateCanvas.height = H * dpr;
        skateCanvas.style.width = W + 'px';
        skateCanvas.style.height = H + 'px';
        skateCtx.scale(dpr, dpr);
        const newGround = getGroundY(H);
        if (state.player.isGrounded) {
          state.player.y = newGround;
        } else {
          state.player.y += newGround - oldGround;
        }
      }
      window.addEventListener("resize", () => { resizeCanvas(); resizeMenuCanvas(); });
      resizeCanvas();

      function drawWorldBackground(width, height, groundY) {
        const world = WORLDS[state.worldIndex];

        // 1. Vaxkrit-himmel + skissbokslinjer
        const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
        skyGrad.addColorStop(0, world.skyTop);
        skyGrad.addColorStop(1, world.skyBottom);
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, groundY);
        if (crayonPattern) {
          ctx.fillStyle = crayonPattern;
          ctx.fillRect(0, 0, width, groundY);
        }

        ctx.strokeStyle = "rgba(130, 160, 200, 0.14)";
        ctx.lineWidth = 1;
        for (let ly = 36; ly < groundY; ly += 32) {
          ctx.beginPath();
          ctx.moveTo(0, ly);
          ctx.lineTo(width, ly);
          ctx.stroke();
        }

        // 1.5 Stjärnor i Nattvärlden
        if (world.id === "nattvarlden") {
          ctx.save();
          const starGrid = [
            [80,45],[220,30],[380,60],[520,25],[650,55],[780,35],[920,50],
            [140,95],[310,80],[460,100],[600,70],[720,90],[860,55],[1000,80],
            [50,130],[200,115],[340,140],[490,120],[640,135],[800,110],[950,130],
            [170,170],[430,155],[570,180],[730,160],[900,145],[1050,170],

          for (const [sx, sy] of starGrid) {
            const twinkle = 0.5 + 0.5 * Math.sin(state.wobbleTime * 3.1 + sx * 0.072 + sy * 0.05);
            const r = 1.4 + (sx * 0.031 + sy * 0.017) % 1.6;
            ctx.fillStyle = `rgba(255, 252, 210, ${0.55 + twinkle * 0.45})`;
            ctx.beginPath();
            ctx.arc(sx, sy, r * twinkle, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // 2. Sol / Måne fasttejpad i skissboken (klickbar!)
        ctx.save();
        ctx.translate(width - 110, 95);
        if (world.id === "nattvarlden") {
          // Söt halvmåne i Nattvärlden
          drawWithPaperCutout(
            (c) => {
              c.fillStyle = "#fefae0";
              c.strokeStyle = "#2c2724";
              c.lineWidth = 3;
              c.beginPath();
              c.arc(0, 0, 32, 0, Math.PI * 2);
              c.fill();
              if (crayonPattern) { c.fillStyle = crayonPattern; c.fill(); }
              c.stroke();
              // Halvmånens skugga
              c.fillStyle = "#1b2838";
              c.beginPath();
              c.arc(14, -6, 26, 0, Math.PI * 2);
              c.fill();
              // Sömnigt ansikte
              c.fillStyle = "#2c2724";
              c.beginPath();
              c.arc(-13, -5, 2.5, 0, Math.PI * 2);
              c.arc(-3, -8, 2.5, 0, Math.PI * 2);
              c.fill();
              c.beginPath();
              c.arc(-8, 4, 7, 0.15 * Math.PI, 0.85 * Math.PI);
              c.stroke();

              c.font = "bold 11px sans-serif";
              c.fillStyle = "rgba(44,39,36,0.6)";
              c.fillText("z", -26, -20);
              c.fillText("z", -32, -31);

            120, 120, 60, 60,

          ctx.fillStyle = "rgba(200, 220, 255, 0.85)";
          ctx.strokeStyle = "rgba(90, 82, 76, 0.45)";

          ctx.strokeRect(-24, -42, 48, 14);
        } else {

      /**
       * =========================================================================
       * SVG-RIGGADE SPELKARAKTÄRER (inline SVG + CSS-animationer)
       * =========================================================================
       * Riggade .svg-filer från extern studio droppas in i svg-players/.
       * Vi hämtar filen, injicerar den inline i <div class="puppet-wrapper">
       * och låter studions CSS (längst ned i <style>) sköta alla rotationer
       * via klass-byten (anim-idle / anim-run / anim-jump / anim-swim +
       * facing-left). Ingen JS rör de animerade grupperna.
       */
      // Kända karaktärer med etikett + emoji. Okända filer i svg-players/
      // får ett automatiskt namn (filnamnet med stor första bokstav) och
      // en standard-emoji — editera här för att ge dem riktiga namn.
      const CHARACTER_META = {
        royal: { label: "Prins / Prinsessa", emoji: "👑" },
        knight: { label: "Riddaren", emoji: "🛡️" },
        wizard: { label: "Trollkarlen", emoji: "🧙" },
        fairy: { label: "Älvan", emoji: "🧚" },
        dragon: { label: "Draken", emoji: "🐲" },
      };
      const FALLBACK_CHARACTERS = Object.keys(CHARACTER_META);

      function puppetSrcFor(characterKey) {
        return characterKey ? `svg-players/${characterKey}.svg` : null;
      }

      function characterLabel(key) {
        if (CHARACTER_META[key]) return CHARACTER_META[key].label;
        return key.charAt(0).toUpperCase() + key.slice(1).replace(/[-_]/g, " ");
      }
      function characterEmoji(key) {
        return CHARACTER_META[key] ? CHARACTER_META[key].emoji : "🎭";
      }

      // Python http.server returnerar en HTML-lista med <a href="X.svg">-länkar
      // när man hämtar en katalog. Vi parsar den för att lista alla tillgängliga
      // figurer. Faller tillbaka till FALLBACK_CHARACTERS om listningen misslyckas
      // (t.ex. om spelet serveras från en server som inte har directory listing).
      async function discoverCharacters() {
        try {
          const res = await fetch("svg-players/");
          if (!res.ok) throw new Error("fetch " + res.status);
          const html = await res.text();
          const doc = new DOMParser().parseFromString(html, "text/html");
          const anchors = doc.querySelectorAll("a[href]");
          const keys = [];
          anchors.forEach((a) => {
            const href = a.getAttribute("href") || "";
            if (!href.toLowerCase().endsWith(".svg")) return;
            const filename = href.split("/").pop();
            const key = filename.replace(/\.svg$/i, "");
            if (key && !keys.includes(key)) keys.push(key);
          });
          return keys;
        } catch (err) {
          console.warn("Kunde inte lista svg-players/:", err);
          return null;
        }
      }

      function renderCharPicker(keys) {
        const picker = document.getElementById("charPicker");
        if (!picker) return;
        picker.innerHTML = "";
        keys.forEach((key) => {
          const btn = document.createElement("button");
          btn.className = "crayon-btn choice-chip char-chip" + (key === state.character ? " active" : "");
          btn.dataset.char = key;
          btn.title = characterLabel(key);
          // Rendera figuren själv som miniatyr — ingen emoji behövs.
          const img = document.createElement("img");
          img.src = puppetSrcFor(key);
          img.alt = characterLabel(key);
          img.className = "char-thumb";
          img.onerror = () => {
            // Fallback till emoji om SVG saknas
            btn.textContent = characterEmoji(key);
          };
          btn.appendChild(img);
          btn.addEventListener("click", () => {
            picker.querySelectorAll(".choice-chip").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            state.character = key;
            loadPuppet(key);
            sound.playPop();
          });
          picker.appendChild(btn);
        });
        // Om nuvarande state.character inte finns i listan: välj första tillgängliga
        if (!keys.includes(state.character)) {
          state.character = keys[0] || "royal";
          const first = picker.querySelector(".choice-chip");
          if (first) first.classList.add("active");
          loadPuppet(state.character);
        }
      }

      async function initCharacterPicker() {
        // Visa fallback-listan direkt så startskärmen inte är tom under tiden.
        renderCharPicker(FALLBACK_CHARACTERS);
        const discovered = await discoverCharacters();
        if (!discovered || discovered.length === 0) return;
        // Sortera: kända figurer i deras definitionsordning, nya alfabetiskt sist.
        const known = FALLBACK_CHARACTERS.filter((k) => discovered.includes(k));
        const unknown = discovered.filter((k) => !FALLBACK_CHARACTERS.includes(k)).sort();
        const ordered = [...known, ...unknown];
        // Omrita bara om listan faktiskt ändrats (undviker att nollställa aktivt val).
        const current = Array.from(document.querySelectorAll("#charPicker .choice-chip")).map(
          (b) => b.dataset.char,
        );
        if (current.join(",") !== ordered.join(",")) renderCharPicker(ordered);
      }

      // SVG:n är 320×320 med fötter på y≈282. Vi placerar wrapperns (160, 282)
      // vid spelarens (player.x, player.y) och skalar ner så att figuren blir
      // ~95 skärmpixlar hög (matchar spelets gamla procedurella storlek).
      const PUPPET_SCALE = 0.42;
      const PUPPET_FEET_X = 160;
      const PUPPET_FEET_Y = 282;

      const PUPPET = {
        ready: false,
        currentSrc: null,
        wrapper: null,
        animClass: null,
        facingLeft: false,
        scale: 0.55, // speglas från dev-sliderns playerScale i applyDevSettings
      };


      async function loadPuppet(characterKey) {
        if (!PUPPET.wrapper) PUPPET.wrapper = document.querySelector(".puppet-wrapper");
        const src = puppetSrcFor(characterKey);
        if (!src || !PUPPET.wrapper) {
          PUPPET.ready = false;
          if (PUPPET.wrapper) PUPPET.wrapper.innerHTML = "";
          return;
        }
        if (PUPPET.currentSrc === src && PUPPET.ready) return;
        PUPPET.ready = false;
        PUPPET.currentSrc = src;
        try {
          const res = await fetch(src);
          if (!res.ok) throw new Error("fetch " + res.status);
          const text = await res.text();
          if (PUPPET.currentSrc !== src) return; // nyare laddning hann starta
          // Ta bort ev. XML-/DOCTYPE-prolog så det kan injiceras som HTML.
          const clean = text
            .replace(/<\?xml[^?]*\?>/i, "")
            .replace(/<!DOCTYPE[^>]*>/i, "")
            .trim();
          PUPPET.wrapper.innerHTML = clean;
          PUPPET.ready = true;
          PUPPET.animClass = null; // tvinga ny klassificering nästa updatePuppet
        } catch (err) {
          console.warn("Kunde inte ladda puppet-SVG", src, err);
          PUPPET.ready = false;
          if (PUPPET.wrapper) PUPPET.wrapper.innerHTML = "";
        }
      }

      function puppetAnimStateFor(player) {
        if (state.mode !== "PLAYING") return "anim-idle";
        // Bananskal: sittande fas har högst prioritet (spelaren står på marken
        // men är "låst" i sitt-pose), därefter luftvolt bakåt under flip-fasen.
        if (player.slipTimer > 0 && player.slipPhase === "sit") return "anim-sit";
        if (player.slipTimer > 0 && player.slipPhase === "flip") return "anim-backflip";
        // Volt vid dubbelhopp (framåt-snurr i luften).
        if (player.spinAngle !== 0 && player.spinDir === 1 && !player.isGrounded) return "anim-flip";
        if (player.flyTimer > 0) return "anim-jump";
        // Simläge: spelaren är faktiskt nedsänkt i vattnet (y ≥ groundY+10) och har
        // simmat i minst 0,5 s — inte bara hoppat över sjön i luften.
        if (state.inLake && !player.ridingTurtle && player.swimTimer >= 0.5) return "anim-swim";
        if (!player.isGrounded) return "anim-jump";
        if (state.inLake && !player.ridingTurtle) return "anim-swim";
        if (player.isChargingJump && !player.ridingTurtle) return "anim-buildup";
        if (player.ridingTurtle) return "anim-balance";
        if (player.skateboardTimer > 0) return "anim-balance";
        return "anim-run";
      }

      function updatePuppet(player) {
        const w = PUPPET.wrapper;
        if (!w) return;
        if (!PUPPET.ready) {
          w.style.visibility = "hidden";
          return;
        }
        w.style.visibility = "";
        const desiredAnim = puppetAnimStateFor(player);
        // Simning: #character-side roterar 76° kring (165, 175) vilket ger
        // figurens tyngdpunkt ~120 viewBox-enheter ovanför fot-ankaret. Vi
        // skjuter wrappern nedåt proportionellt mot skalan så att huvudet
        // precis rör vattenytan istället för att sväva ovanför den.
        const swimDrop = desiredAnim === "anim-swim" ? 120 * PUPPET.scale : 0;
        const skateLift = player.skateboardTimer > 0 && player.flyTimer <= 0 && !state.inLake ? 10 : 0;
        w.style.left = player.x - PUPPET_FEET_X + "px";
        w.style.top = player.y - PUPPET_FEET_Y + swimDrop - skateLift + "px";
        if (desiredAnim !== PUPPET.animClass) {
          if (PUPPET.animClass) w.classList.remove(PUPPET.animClass);
          w.classList.add(desiredAnim);
          PUPPET.animClass = desiredAnim;
        }
        // Spelet scrollar höger → figuren tittar alltid höger just nu.
        const faceLeft = false;
        if (faceLeft !== PUPPET.facingLeft) {
          w.classList.toggle("facing-left", faceLeft);
          PUPPET.facingLeft = faceLeft;
        }
      }

      // === PLAYER: draw (SVG puppet positioning + canvas accessories like balloons, umbrella, speech bubble) ===
      function drawSprattelgubbe(player) {
        ctx.save();
        ctx.translate(player.x, player.y);

        const isSwimming = state.inLake && !player.ridingTurtle;
        const isFlying = player.flyTimer > 0;
        const isSkating = player.skateboardTimer > 0 && !isFlying && !isSwimming;
        const hasUmbrella = player.umbrellaTimer > 0 && !isFlying && !isSwimming;

        // Insamlade ballonger bundna i handen (ritade bakom figuren)
        if (player.balloons > 0) {
          const balloonColors = ["#ff595e", "#ffd166", "#4cc9f0"];
          for (let b = 0; b < player.balloons; b++) {
            const spread = (b - (player.balloons - 1) * 0.5) * 26;
            const sway = Math.sin(state.wobbleTime * 4 + b) * 5;
            const bx = 14 + spread + sway;
            const by = -118 - (b % 2) * 12;

            drawHandLine(ctx, 14, -56, bx, by + 18, 2.2, "#2c2724");
            ctx.save();
            ctx.translate(bx, by);
            drawWithPaperCutout(
              (c) => {
                c.fillStyle = balloonColors[b % balloonColors.length];
                c.strokeStyle = "#2c2724";
                c.lineWidth = 2.5;
                c.beginPath();
                c.ellipse(0, 0, 15, 19, 0, 0, Math.PI * 2);
                c.fill();
                if (crayonPattern) {
                  c.fillStyle = crayonPattern;
                  c.fill();
                }
                c.stroke();
              },
              56,
              62,
              28,
              31,
            );
