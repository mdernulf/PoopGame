      /**
       * =========================================================================
       * 6. SPRATTELGUBBEN MED LEDADE ARMAR & BEN FÖR ALLA RÖRELSESÄTT
       * =========================================================================
       */

      function drawSprattelgubbe(player) {
        ctx.save();
        ctx.translate(player.x, player.y);

        const isSwimming = state.inLake;
        const isFlying = player.flyTimer > 0;
        const isSkating = player.skateboardTimer > 0 && !isFlying && !isSwimming;
        const hasUmbrella = player.umbrellaTimer > 0 && !isFlying && !isSwimming;

        // Insamlade ballonger bundna i handen (ritade bakom figuren)
        if (player.balloons > 0) {
          const balloonColors = ["#ff595e", "#ffd166", "#4cc9f0"];
          for (let b = 0; b < player.balloons; b++) {
            const spread = (b - (player.balloons - 1) * 0.5) * 26;
            const sway = Math.sin(state.wobbleTime * 4 + b) * 5;
            const bx = 14 + spread + sway;
            const by = -118 - (b % 2) * 12;

            drawHandLine(ctx, 14, -56, bx, by + 18, 2.2, "#2c2724");
            ctx.save();
            ctx.translate(bx, by);
            drawWithPaperCutout(
              (c) => {
                c.fillStyle = balloonColors[b % balloonColors.length];
                c.strokeStyle = "#2c2724";
                c.lineWidth = 2.5;
                c.beginPath();
                c.ellipse(0, 0, 15, 19, 0, 0, Math.PI * 2);
                c.fill();
                if (crayonPattern) {
                  c.fillStyle = crayonPattern;
                  c.fill();
                }
                c.stroke();
              },
              56,
              62,
              28,
              31,
            );
            ctx.restore();
          }
        }

        // Rotation vid kullebytta, bakåtvolt på bananskal eller snubbel
        let bodyTilt = 0;
        if (player.spinAngle !== 0) {
          bodyTilt = player.spinAngle;
        } else if (player.slipTimer > 0 && player.slipPhase === "sit") {
          // Skakar av sig när man sitter på rumpan!
          bodyTilt = Math.sin(state.wobbleTime * 42) * 0.24;
        } else if (player.stumbleTimer > 0) {
          bodyTilt = Math.sin(state.wobbleTime * 35) * 0.25;
        } else if (isSwimming) {
          // Ligger nästan horisontellt framåtlutad i vattnet så det ser ut som att han simmar!
          bodyTilt = 1.28 + Math.sin(state.wobbleTime * 7) * 0.06;
        } else if (player.isDucking) {
          bodyTilt = 0.28;
        }

        // Sänk ner figuren på rumpan under sitt-fasen efter bananskalet
        const sitOffsetY = player.slipTimer > 0 && player.slipPhase === "sit" ? 22 : 0;

        ctx.save();
        ctx.translate(0, (isSwimming ? -16 : -45) + sitOffsetY);
        ctx.rotate(bodyTilt);
        ctx.translate(0, 45);

        // Regnbågs-pruttmoln bakom figuren
        if (player.rainbowFartTimer > 0) {
          const rbColors = ["#ff595e", "#ffca3a", "#8ac926", "#1982c4", "#6a4c93"];
          rbColors.forEach((col, idx) => {
            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.arc(-28 - idx * 14, -34 + Math.sin(state.wobbleTime * 15 + idx) * 6, 12 - idx, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        // Mary Poppins-paraply ovanför huvudet
        if (hasUmbrella) {
          ctx.save();
          ctx.translate(12, -96);
          drawWithPaperCutout(
            (c) => {
              c.strokeStyle = "#2c2724";
              c.lineWidth = 3;

              // Paraplyskaft ner till handen
              c.beginPath();
              c.moveTo(0, -28);
              c.lineTo(0, 42);
              c.arc(-5, 42, 5, 0, Math.PI, false);
              c.stroke();

              // Paraplyskärm
              c.fillStyle = "#9b5de5";
              c.beginPath();
              c.arc(0, -4, 34, Math.PI, 0, false);
              c.quadraticCurveTo(22, -11, 11, -4);
              c.quadraticCurveTo(0, -11, -11, -4);
              c.quadraticCurveTo(-22, -11, -34, -4);
              c.closePath();
              c.fill();
              if (crayonPattern) {
                c.fillStyle = crayonPattern;
                c.fill();
              }
              c.stroke();

              // Smutsfläckar från fågelbajs uppe på paraplyet!
              for (let d = 0; d < player.umbrellaDirt; d++) {
                const dx = -16 + ((d * 13) % 32);
                const dy = -26 + ((d * 7) % 14);
                c.fillStyle = "#ffffff";
                c.beginPath();
                c.ellipse(dx, dy, 6.5, 4, 0.2, 0, Math.PI * 2);
                c.fill();
                c.stroke();
                c.fillStyle = "#3d405b";
                c.beginPath();
                c.arc(dx, dy, 2.5, 0, Math.PI * 2);
                c.fill();
              }
            },
            110,
            110,
            55,
            50,
          );
          ctx.restore();
        }

        // Rita själva sprattelgubben: DOM/CSS-puppet om tillgänglig,
        // annars procedurell canvas-ritning.
        if (PUPPET.ready) {
          // Figuren ritas av CSS/SVG-wrappern utanför canvasen — gör inget här.
        } else drawWithPaperCutout(
          (c) => {
            c.strokeStyle = "#2c2724";
            c.lineWidth = 3;
            c.lineCap = "round";
            c.lineJoin = "round";

            const duckY = player.isDucking && !isSwimming && !isFlying ? 18 : 0;
            const chargeSquash =
              player.isChargingJump && player.isGrounded && !isSwimming && !isFlying ? Math.min(14, player.jumpCharge * 14) : 0;
            const crouchY = duckY + chargeSquash;

            // Beräkna benvinklar beroende på rörelsesätt!
            let leftLegAngle = 0,
              rightLegAngle = 0;
            if (isFlying) {
              // Mjukt dinglande ben under ballongflygning
              leftLegAngle = Math.sin(state.wobbleTime * 3) * 0.14 + 0.08;
              rightLegAngle = Math.cos(state.wobbleTime * 3) * 0.14 - 0.08;
            } else if (isSkating) {
              // Stadig skateboard-stance på brädan
              leftLegAngle = 0.28;
              rightLegAngle = -0.28;
            } else if (isSwimming) {
              // Små bensparkar bakåt i vattnet medan kroppen ligger horisontellt
              leftLegAngle = Math.sin(state.wobbleTime * 15) * 0.34;
              rightLegAngle = -Math.sin(state.wobbleTime * 15) * 0.34;
            } else if (player.slipTimer > 0 && player.slipPhase === "sit") {
              // Sitter med benen utsträckta framåt på marken!
              leftLegAngle = -1.42;
              rightLegAngle = -1.32;
            } else if (chargeSquash > 0) {
              // Böjer knäna djupt medan hoppet laddas upp!
              leftLegAngle = 0.35 + player.jumpCharge * 0.55;
              rightLegAngle = -0.35 - player.jumpCharge * 0.55;
            } else if (player.isDucking) {
              leftLegAngle = 0.65;
              rightLegAngle = -0.65;
            } else {
              // Vanligt springsteg
              leftLegAngle = Math.sin(player.runCycle) * 0.68;
              rightLegAngle = -Math.sin(player.runCycle) * 0.68;
            }

            // Beräkna armvinklar beroende på rörelsesätt!
            let leftArmAngle = 0,
              rightArmAngle = 0;
            if (isSwimming) {
              // Riktiga crawl-simtag runt axeln!
              leftArmAngle = state.wobbleTime * 8;
              rightArmAngle = state.wobbleTime * 8 + Math.PI;
            } else if (isFlying) {
              // Armen sträckt uppåt mot ballongsnörena
              leftArmAngle = -0.4;
              rightArmAngle = -2.45;
            } else if (hasUmbrella) {
              leftArmAngle = 0.35;
              rightArmAngle = -2.25;
            } else if (isSkating) {
              // Balansarmar ute åt sidorna
              leftArmAngle = 0.85 + Math.sin(state.wobbleTime * 6) * 0.12;
              rightArmAngle = -0.85 - Math.sin(state.wobbleTime * 6) * 0.12;
            } else if (chargeSquash > 0) {
              // Drar armarna bakåt för att ta sats!
              leftArmAngle = 0.65 + player.jumpCharge * 0.55;
              rightArmAngle = 0.5 + player.jumpCharge * 0.55;
            } else if (player.slipTimer > 0 && player.slipPhase === "sit") {
              // Skakar av sig dammet med armarna!
              leftArmAngle = Math.sin(state.wobbleTime * 38) * 0.95;
              rightArmAngle = -Math.sin(state.wobbleTime * 38) * 0.95;
            } else {
              leftArmAngle = -Math.sin(player.runCycle) * 0.62;
              rightArmAngle = Math.sin(player.runCycle) * 0.62;
            }

            // Älvans vingar bakom ryggen
            if (state.character === "fairy") {
              const flap = Math.sin(state.wobbleTime * 18) * 6;
              c.fillStyle = "rgba(224, 251, 252, 0.9)";
              c.beginPath();
              c.ellipse(-18, -48 + crouchY + flap * 0.4, 18, 10, -0.4, 0, Math.PI * 2);
              c.ellipse(-15, -34 + crouchY - flap * 0.4, 14, 8, 0.3, 0, Math.PI * 2);
              c.fill();
              c.stroke();
            }

            // Drakens svans & ryggtaggar
            if (state.character === "dragon") {
              c.fillStyle = state.puppetColor;
              c.beginPath();
              c.moveTo(-12, -26 + crouchY);
              c.quadraticCurveTo(-34, -22 + crouchY, -38, -36 + crouchY);
              c.quadraticCurveTo(-24, -36 + crouchY, -12, -34 + crouchY);
              c.closePath();
              c.fill();
              c.stroke();
            }

            // Bakre arm
            c.save();
            c.translate(0, -54 + crouchY);
            c.rotate(leftArmAngle);
            c.fillStyle = "#ffe5d9";
            fillRoundRect(c, -5, 0, 10, 26, 5);
            c.fill();
            c.stroke();
            c.restore();

            // Bakre ben + sko
            c.save();
            c.translate(-4, -26 + crouchY);
            c.rotate(leftLegAngle);
            c.fillStyle = "#3d405b";
            fillRoundRect(c, -6, 0, 12, 24, 5);
            c.fill();
            c.stroke();
            c.fillStyle = "#ff595e";
            fillRoundRect(c, -5, 20, 17, 9, 4);
            c.fill();
            c.stroke();
            c.restore();

            // Främre ben + sko
            c.save();
            c.translate(4, -26 + crouchY);
            c.rotate(rightLegAngle);
            c.fillStyle = "#3d405b";
            fillRoundRect(c, -6, 0, 12, 24, 5);
            c.fill();
            c.stroke();
            c.fillStyle = "#ff595e";
            fillRoundRect(c, -5, 20, 17, 9, 4);
            c.fill();
            c.stroke();
            c.restore();

            // Kropp / dräkt
            c.fillStyle = state.puppetColor;
            fillRoundRect(c, -15, -60 + crouchY, 30, 36, 10);
            c.fill();
            if (crayonPattern) {
              c.fillStyle = crayonPattern;
              c.fill();
            }
            c.stroke();

            // Karaktärsdetaljer på dräkten
            if (state.character === "knight") {
              c.fillStyle = "#ffd166";
              c.beginPath();
              c.moveTo(-7, -50 + crouchY);
              c.lineTo(7, -50 + crouchY);
              c.lineTo(7, -40 + crouchY);
              c.lineTo(0, -34 + crouchY);
              c.lineTo(-7, -40 + crouchY);
              c.closePath();
              c.fill();
              c.stroke();
            } else if (state.character === "wizard") {
              c.fillStyle = "#ffd166";
              c.beginPath();
              c.arc(0, -44 + crouchY, 5, 0, Math.PI * 2);
              c.fill();
            }

            // Främre arm
            c.save();
            c.translate(2, -54 + crouchY);
            c.rotate(rightArmAngle);
            c.fillStyle = "#ffe5d9";
            fillRoundRect(c, -5, 0, 10, 26, 5);
            c.fill();
            c.stroke();
            c.restore();

            // Mässingsklämmor (jungfruben) i lederna
            drawBrassFastener(c, 2, -54 + crouchY, 4.2);
            drawBrassFastener(c, 0, -26 + crouchY, 4.2);

            // Huvud
            c.fillStyle = "#ffe5d9";
            if (isSwimming) {
              // Vinkla upp huvudet lite så ansiktet och blicken pekar framåt ovanför vattenytan
              c.save();
              c.translate(2, -74 + crouchY);
              c.rotate(-0.85);
              c.beginPath();
              c.arc(0, 0, 16, 0, Math.PI * 2);
              c.fill();
              c.stroke();

              c.fillStyle = "#ff758f";
              c.beginPath();
              c.arc(6, 3, 3.2, 0, Math.PI * 2);
              c.fill();

              c.fillStyle = "#2c2724";
              c.beginPath();
              c.arc(5, -2, 2.2, 0, Math.PI * 2);
              c.fill();

              c.beginPath();
              c.arc(4, 3, 6, 0.1 * Math.PI, 0.85 * Math.PI);
              c.stroke();
              c.restore();
            } else {
              c.beginPath();
              c.arc(2, -74 + crouchY, 16, 0, Math.PI * 2);
              c.fill();
              c.stroke();

              // Glada ögon, kinder & mun
              c.fillStyle = "#ff758f";
              c.beginPath();
              c.arc(8, -71 + crouchY, 3.2, 0, Math.PI * 2);
              c.fill();

              c.fillStyle = "#2c2724";
              c.beginPath();
              c.arc(7, -76 + crouchY, 2.2, 0, Math.PI * 2);
              c.fill();

              c.beginPath();
              if (player.stumbleTimer > 0 || player.slipTimer > 0) {
                c.arc(6, -69 + crouchY, 4, 0, Math.PI * 2);
              } else {
                c.arc(6, -71 + crouchY, 6, 0.1 * Math.PI, 0.85 * Math.PI);
              }
              c.stroke();
            }

            // Skateboard under fötterna när man åker skateboard
            if (isSkating) {
              c.fillStyle = "#ff9f1c";
              fillRoundRect(c, -26, -6, 52, 7, 3);
              c.fill();
              c.stroke();
              c.fillStyle = "#4cc9f0";
              c.beginPath();
              c.arc(-15, 4, 5, 0, Math.PI * 2);
              c.arc(15, 4, 5, 0, Math.PI * 2);
              c.fill();
              c.stroke();
            }
          },
          160,
          175,
          80,
          145,
        );

        ctx.restore();

        // Handritad uppladdningsmätare under fötterna när man laddar ett långt/högt hopp!
        if (player.isChargingJump && player.isGrounded && !isSwimming && !isFlying) {
          ctx.save();
          ctx.translate(0, 14);
          ctx.fillStyle = "#fffdf7";
          ctx.strokeStyle = "#2c2724";
          ctx.lineWidth = 2.6;
          fillRoundRect(ctx, -34, -6, 68, 12, 6);
          ctx.fill();
          ctx.stroke();

          const fillW = Math.max(8, 62 * player.jumpCharge);
          ctx.fillStyle = player.jumpCharge > 0.75 ? "#ff595e" : player.jumpCharge > 0.35 ? "#ffd166" : "#06d6a0";
          fillRoundRect(ctx, -31, -3, fillW, 6, 3);
          ctx.fill();
          ctx.restore();
        }

        // Vattenlinje över kroppen när man flyter i sjön så att bara huvudet sticker upp!
        if (isSwimming) {
          const groundY = getGroundY(canvas.height);
          const waterRelY = groundY - player.y;
          if (waterRelY < -14) {
            ctx.save();
            ctx.fillStyle = "rgba(76, 201, 240, 0.72)";
            ctx.fillRect(-58, waterRelY, 96, -waterRelY + 12);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-58, waterRelY);
            ctx.quadraticCurveTo(-10, waterRelY - 5, 38, waterRelY);
            ctx.stroke();
            ctx.restore();
          }
        }

        // Pratbubbla ovanför figuren (stora tydliga ikoner så man slipper läsa!)
        if (player.speechTimer > 0 && player.speechText) {
          ctx.save();
          ctx.translate(20, -122);
          ctx.font = "bold 24px sans-serif";
          const textW = Math.max(66, ctx.measureText(player.speechText).width + 26);
          ctx.fillStyle = "#fffdf7";
          ctx.strokeStyle = "#2c2724";
          ctx.lineWidth = 2.8;
          fillRoundRect(ctx, -textW / 2, -32, textW, 40, 14);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "#2c2724";
          ctx.textAlign = "center";
          ctx.fillText(player.speechText, 0, -4);
          ctx.restore();
        }

        ctx.restore();
      }

      function spawnParticles(x, y, color, count = 10, burst = false) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = burst ? 90 + Math.random() * 170 : 35 + Math.random() * 95;
          state.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - (burst ? 90 : 40),
            size: 3 + Math.random() * 4.5,
            color,
            life: 0.45 + Math.random() * 0.35,
          });
        }
      }

      function startJumpPress() {
        sound.init();
        if (state.mode !== "PLAYING") return;
        const p = state.player;
        if (state.inLake) {
          // Varje tryck simmar ett steg djupare ner under vattenytan!
          p.vy = Math.min(340, Math.max(155, p.vy + 145));
          spawnParticles(p.x, p.y - 10, "#ffffff", 6, false);
          return;
        }
        if (p.flyTimer > 0) {
          p.vy = -260;
          sound.playPop();
          return;
        }
        if (p.slipTimer > 0) {
          p.slipTimer = 0;
          p.spinAngle = 0;
          p.spinDir = 1;
          p.vy = -610;
          p.isGrounded = false;
          p.jumpsLeft = 1;
          sound.playJump();
          p.speechText = "🍌⬆️✨";
          p.speechTimer = 0.9;
          return;
        }
        if (p.isGrounded) {
          // Börja ladda hoppet – snabbt tryck ger vanligt hopp, längre håll ger superhopp!
          p.isChargingJump = true;
          p.jumpCharge = 0;
          p.isDucking = false;
          sound.startBuildup();
        } else if (p.jumpsLeft > 0) {
          p.vy = -560;
          p.jumpsLeft = 0;
          p.spinDir = 1;
          p.spinAngle = 0.01;
          sound.playJump();
          spawnParticles(p.x, p.y - 30, "#ffd166", 10, false);
          if (p.skateboardTimer > 0) {
            state.stars += 2;
            document.getElementById("starCount").textContent = state.stars;
            p.speechText = "🛹🔄 +2";
            p.speechTimer = 1.0;
          } else {
            p.speechText = "🔄✨";
            p.speechTimer = 0.9;
          }
        }
      }

      function releaseJumpPress() {
        const p = state.player;
        if (!p.isChargingJump) return;
        p.isChargingJump = false;
        sound.stopBuildup();
        if (state.mode !== "PLAYING" || !p.isGrounded || state.inLake || p.flyTimer > 0) {
          p.jumpCharge = 0;
          return;
        }

        // Kort tryck (< 0.14s) = vanligt hopp (-640), full uppladdning = superhopp (-930) + längre framåtskjuts!
        const effectiveCharge = p.jumpCharge < 0.16 ? 0 : p.jumpCharge;
        p.vy = -640 - effectiveCharge * 290;
        p.isGrounded = false;
        p.jumpsLeft = 1;
        p.isDucking = false;
        sound.playJump();

        if (effectiveCharge > 0.25) {
          sound.playStar();
          p.speechText = effectiveCharge > 0.75 ? "🚀⬆️✨" : "⬆️✨";
          p.speechTimer = 0.95;
          spawnParticles(p.x, p.y, "#ffd166", 14, true);
        } else {
          spawnParticles(p.x, p.y, "#ffffff", 7, false);
        }
        p.jumpCharge = 0;
      }

      function setDucking(ducking) {
        sound.init();
        if (state.mode !== "PLAYING") return;
        state.player.isDucking = ducking;
      }

      function showWorldBanner() {
        const world = WORLDS[state.worldIndex];
        document.getElementById("worldEmoji").textContent = world.emoji;
        document.getElementById("worldName").textContent = world.name;
        const banner = document.getElementById("worldBanner");
        banner.textContent = `${world.emoji} ${world.name}!`;
        banner.classList.remove("hidden-banner");
        setTimeout(() => banner.classList.add("hidden-banner"), 1700);
      }

      function updateMagnetUI() {
        const count = state.magnets.length;
        document.getElementById("magnetHudCount").textContent = `${Math.min(3, count)}/3`;

        ["kioskMagnetSlots", "startMagnetSlots"].forEach((containerId) => {
          const container = document.getElementById(containerId);
          if (!container) return;
          const slots = container.querySelectorAll(".magnet-slot");
          slots.forEach((slot, idx) => {
            if (state.magnets[idx]) {
              slot.textContent = state.magnets[idx];
              slot.classList.add("earned");
            } else {
              slot.textContent = "?";
              slot.classList.remove("earned");
            }
          });
        });

        if (state.unicornUnlocked) {
          document.getElementById("unicornWorldBtn").classList.remove("hidden");
        }
      }


      function buildLakesForLevel() {
        const len = state.levelLength;
        state.lakes = [
          { x: len * 0.28, width: 1580 },
          { x: len * 0.66, width: 1740 },
        ];

        const groundY = getGroundY(canvas.height);
        const lakeDepth = Math.min(130, (canvas.height - groundY) * 0.72);
        state.crabs = [];
        state.seahorses = [];

        const seahorseColors = ["#ff8fab", "#c77dff", "#ffd166", "#80ed99"];

        state.lakes.forEach((lake, idx) => {
          // 1. En strandkrabba strax före sjön
          state.crabs.push({
            x: lake.x - 85,
            homeX: lake.x - 85,
            y: groundY,
            dir: -1,
            pinched: false,
            inWater: false,
          });

          // 2. Krabbor på sjöbotten på tydligt bestämda zoner (så badankor aldrig ligger ovanför dem!)
          const bottomZones = idx === 0 ? [lake.x + 520, lake.x + 1140] : [lake.x + 560, lake.x + 1240];

          bottomZones.forEach((bx) => {
            state.crabs.push({
              x: bx,
              homeX: bx,
              y: groundY + lakeDepth - 4,
              dir: -1,
              pinched: false,
              inWater: true,
            });
          });

          // 3. Snälla sjöhästar som hälsar i vattnet och ger bonusstjärnor!
          const seahorsePositions = [lake.x + 830, lake.x + lake.width - 260];
          seahorsePositions.forEach((sx, sIdx) => {
            state.seahorses.push({
              x: sx,
              y: groundY + lakeDepth * 0.48,
              color: seahorseColors[(idx + sIdx) % seahorseColors.length],
              greeted: false,
            });
          });
        });
      }

      function startGame() {
        sound.init();
        sound.startAmbient();
        state.mode = "PLAYING";
        state.levelNumber = 1;
        state.stars = 0;
        state.worldDistance = 0;
        state.levelLength = 12800;
        state.candyKiosk = null;
        state.inLake = false;

        const groundY = getGroundY(canvas.height);
        Object.assign(state.player, {
          x: Math.min(180, canvas.width * 0.22),
          y: groundY,
          vy: 0,
          isGrounded: true,
          jumpsLeft: 2,
          isChargingJump: false,
          jumpCharge: 0,
          spinAngle: 0,
          spinDir: 1,
          isDucking: false,
          stumbleTimer: 0,
          slipTimer: 0,
          slipPhase: "none",
          crabSlowTimer: 0,
          rainbowFartTimer: 0,
          skateboardTimer: 0,
          umbrellaTimer: 0,
          umbrellaDirt: 0,
          balloons: 0,
          flyTimer: 0,
          speechText: "▶️⭐",
          speechTimer: 1.2,
          wingFlap: 0,
        });

        state.dogs = [];
        state.birds = [];
        state.poops = [];
        state.bananaPeels = [];
        state.crabs = [];
        state.seahorses = [];
        state.rubberDucks = [];
        state.escapedBalloons = [];
        state.collectibles = [];
        state.particles = [];
        state.spawnTimer = 2.0;
        state.bananaTimer = 6.2;
        state.duckTimer = 2.1;
        state.starTimer = 1.15;

        document.getElementById("starCount").textContent = "0";
        document.getElementById("balloonCount").textContent = "0/3";
        document.getElementById("progressCount").textContent = "0%";
        document.getElementById("startOverlay").classList.add("hidden");
        document.getElementById("kioskOverlay").classList.add("hidden");
        document.getElementById("hudLayer").classList.remove("hidden");

        initCloudsAndProps();
        buildLakesForLevel();
        showWorldBanner();
      }

      function startNextLevel(candyName) {
        state.levelNumber++;
        state.worldIndex = (state.worldIndex + 1) % WORLDS.length;
        state.worldDistance = 0;
        state.levelLength = 12800 + (state.levelNumber - 1) * 1800;
        state.candyKiosk = null;
        state.inLake = false;
        state.dogs = [];
        state.birds = [];
        state.poops = [];
        state.bananaPeels = [];
        state.crabs = [];
        state.seahorses = [];
        state.rubberDucks = [];
        state.escapedBalloons = [];
        state.collectibles = [];
        state.stars += 5;
        document.getElementById("starCount").textContent = state.stars;
        document.getElementById("progressCount").textContent = "0%";

        const groundY = getGroundY(canvas.height);
        state.player.y = groundY;
        state.player.vy = 0;
        state.player.isGrounded = true;
        state.player.speechText = `${candyName.split(" ")[0]} +5`;
        state.player.speechTimer = 1.5;

        state.mode = "PLAYING";
        document.getElementById("kioskOverlay").classList.add("hidden");
        initCloudsAndProps();
        buildLakesForLevel();
        showWorldBanner();
      }

      function update(dt) {
        state.wobbleTime += dt;
        const width = canvas.width;
        const height = canvas.height;
        const groundY = getGroundY(height);

        // Moln & sol rör sig och animeras alltid mjukt i bakgrunden
        if (state.sunSmileTimer > 0) state.sunSmileTimer -= dt;
        for (const cloud of state.clouds) {
          if (cloud.bounceTimer > 0) cloud.bounceTimer -= dt;
          cloud.x -= cloud.speed * dt;
          if (cloud.x < -120) cloud.x = width + 120;
        }

        if (state.mode === "START") {
          state.player.y = groundY;
          state.player.runCycle += dt * 7;
          return;
        }

        if (state.mode !== "PLAYING") return;

        const p = state.player;
        if (p.isChargingJump && p.isGrounded && !state.inLake && p.flyTimer <= 0) {
          p.jumpCharge = Math.min(1, p.jumpCharge + dt * 1.45);
          if (Math.random() < 0.45) {
            spawnParticles(p.x + (Math.random() - 0.5) * 30, p.y - 6, "#ffd166", 1, false);
          }
        } else if (!p.isGrounded || state.inLake) {
          if (p.isChargingJump) sound.stopBuildup();
          p.isChargingJump = false;
          p.jumpCharge = 0;
        }

        const baseSpeed = state.fastMode ? 330 : 235;
        const progressRatio = Math.min(1, state.worldDistance / state.levelLength);
        const speedBoost = progressRatio * 75 + (state.levelNumber - 1) * 18;
        // Extra fart framåt när man gör ett uppladdat superhopp så hoppet blir rejält mycket längre!
        const longJumpBoost = !p.isGrounded && !state.inLake && p.vy < -250 ? Math.max(0, (-p.vy - 640) * 0.65) : 0;
        let currentSpeed = baseSpeed + speedBoost + (p.skateboardTimer > 0 ? 75 : 0) + longJumpBoost;

        // Turbo-scroll: håll piltangenten höger för att snabbspola framåt genom banan.
        // Spelaren blir immun mot hinder så man inte dör mitt i snabbspolningen.
        if (state.turboScroll) {
          currentSpeed *= 6;
          p.rainbowFartTimer = Math.max(p.rainbowFartTimer, 0.3);
          p.slipTimer = 0;
          p.stumbleTimer = 0;
          p.crabSlowTimer = 0;
        }

        // Stanna upp när man sitter och skakar av sig efter bananskal, eller gå sakta vid krabb-nyp!
        if (p.slipTimer > 0 && p.slipPhase === "sit") {
          currentSpeed = 0;
        } else if (p.crabSlowTimer > 0) {
          currentSpeed *= 0.45;
        } else if (p.isChargingJump && p.isGrounded && !state.inLake && p.flyTimer <= 0) {
          // Sakta in mjukt medan sprattelgubben böjer knäna och tar sats inför superhoppet!
          currentSpeed *= Math.max(0.45, 1 - p.jumpCharge * 0.55);
        }

        state.worldDistance += currentSpeed * dt;
        const pct = Math.min(100, Math.floor((state.worldDistance / state.levelLength) * 100));
        document.getElementById("progressCount").textContent = `${pct}%`;

        // Flytta bakgrundsrekvisita & sjöar
        const world = WORLDS[state.worldIndex];
        for (const prop of state.bgElements) {
          prop.x -= currentSpeed * 0.55 * dt;
          if (prop.x < -140 || prop.worldId !== world.id) {
            if (prop.x < -140) {
              prop.x = width + 140 + Math.random() * 120;
            }
            prop.worldId = world.id;
            prop.type = world.propTypes[Math.floor(Math.random() * world.propTypes.length)];
          }
        }

        const wasInLake = state.inLake;
        state.inLake = false;
        for (const lake of state.lakes) {
          lake.x -= currentSpeed * dt;
          if (p.x > lake.x + 18 && p.x < lake.x + lake.width - 18) {
            state.inLake = true;
          }
        }

        // När spelaren just hoppar i en ny sjö: ta bort ankor som hunnit driva
        // för nära (orimligt att undvika), men behåll de som fortfarande är långt
        // bort till höger så flödet med flera ankor per sjö finns kvar.
        if (state.inLake && !wasInLake) {
          const safeX = p.x + 900;
          state.rubberDucks = state.rubberDucks.filter((d) => d.x >= safeX);
        }

        // Skateboard kan inte köras i vattnet – lämnas vid strandkanten om man hoppar i sjön
        if (state.inLake && p.skateboardTimer > 0) {
          p.skateboardTimer = 0;
          p.speechText = "💦🏊‍♂️⬇️";
          p.speechTimer = 1.1;
        }

        // Godiskiosken dyker upp vid mållinjen!
        if (state.worldDistance >= state.levelLength && !state.candyKiosk) {
          state.candyKiosk = { x: width + 120 };
        }
        if (state.candyKiosk) {
          state.candyKiosk.x -= currentSpeed * dt;
          if (state.candyKiosk.x <= p.x + 35) {
            state.mode = "KIOSK";
            sound.playFanfare();

            // Ge en ny kylskåpsmagnet när man klarar banan!
            const newMagnet = MAGNET_ICONS[(state.levelNumber - 1) % MAGNET_ICONS.length];
            state.magnets.push(newMagnet);
            if (state.magnets.length >= 3 && !state.unicornUnlocked) {
              state.unicornUnlocked = true;
              document.getElementById("magnetUnlockText").textContent = "🦄 3/3! Magic Unicorn World upplåst!";
            } else {
              document.getElementById("magnetUnlockText").textContent = `🧲 ${newMagnet} (${Math.min(3, state.magnets.length)}/3 = 🦄)`;
            }
            updateMagnetUI();

            document.getElementById("kioskTitle").textContent = `🍭 Mål! Bana ${state.levelNumber} klarad!`;
            document.getElementById("kioskOverlay").classList.remove("hidden");
            return;
          }
        }

        // Nedräkning av powerups & timers
        if (p.stumbleTimer > 0) p.stumbleTimer -= dt;
        if (p.slipTimer > 0) {
          p.slipTimer -= dt;
          if (p.slipTimer <= 0) {
            p.slipPhase = "none";
          }
        }
        if (p.crabSlowTimer > 0) p.crabSlowTimer -= dt;
        if (p.rainbowFartTimer > 0) p.rainbowFartTimer -= dt;
        if (p.skateboardTimer > 0) p.skateboardTimer -= dt;
        if (p.umbrellaTimer > 0) p.umbrellaTimer -= dt;
        if (p.speechTimer > 0) p.speechTimer -= dt;

        // Spelarfysik: Ballongflygning / Sjösimning / Hopp & Mary Poppins-svävning
        if (p.flyTimer > 0) {
          p.flyTimer -= dt;
          const targetFlyY = groundY - Math.min(220, height * 0.36);
          p.y += (targetFlyY - p.y) * 4 * dt + p.vy * dt;
          p.vy *= 0.85;
          p.isGrounded = false;
          if (p.flyTimer <= 0) {
            p.balloons = 0;
            document.getElementById("balloonCount").textContent = "0/3";
            sound.playPop();
            p.speechText = "💥🎈";
            p.speechTimer = 1.2;
            spawnParticles(p.x, p.y - 100, "#ff595e", 18, true);
          }
        } else if (state.inLake) {
          // Simfysik i sjön: ligger horisontellt med huvudet precis ovanför vattenytan
          const lakeBottomY = groundY + Math.min(130, (height - groundY) * 0.72);
          const surfaceY = groundY + 26;
          p.vy -= 340 * dt;
          p.vy *= 0.89;
          p.y += p.vy * dt;
          if (p.y < surfaceY) {
            p.y = surfaceY;
            p.vy = 0;
          }
          if (p.y > lakeBottomY) {
            p.y = lakeBottomY;
            p.vy = 0;
          }
          p.isGrounded = false;
          p.spinAngle = 0;
          if (Math.random() < 0.3) {
            spawnParticles(p.x - 42, p.y - 12, "#ffffff", 1, false);
          }
        } else if (!p.isGrounded) {
          // Mary Poppins-paraply ger långsam svävning neråt!
          const gravity = p.umbrellaTimer > 0 && p.vy > 0 ? 380 : 1520;
          p.vy += gravity * dt;
          if (p.umbrellaTimer > 0 && p.vy > 140) p.vy = 140;
          p.y += p.vy * dt;

          if (p.spinAngle !== 0) {
            p.spinAngle += dt * 11 * (p.spinDir || 1);
            if (Math.abs(p.spinAngle) >= Math.PI * 2) {
              p.spinAngle = 0;
              p.spinDir = 1;
            }
          }

          if (p.y >= groundY) {
            p.y = groundY;
            p.vy = 0;
            p.isGrounded = true;
            p.jumpsLeft = 2;
            p.spinAngle = 0;
            p.spinDir = 1;
            // Efter bakåtvolten från bananskalet blir man sittande och skakar av sig!
            if (p.slipPhase === "flip") {
              p.slipPhase = "sit";
              p.slipTimer = 0.95;
              p.speechText = "🍌💫";
              p.speechTimer = 0.95;
              spawnParticles(p.x, groundY - 8, "#ffd166", 10, false);
            }
          }
        } else {
          p.y = groundY;
          p.runCycle += dt * (currentSpeed * 0.048);
        }

        // Spawna hundar & fåglar
        const spawnOnLake = state.lakes.some((l) => width + 80 > l.x - 40 && width + 80 < l.x + l.width + 40);
        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0 && !state.candyKiosk) {
          if (spawnOnLake || Math.random() < 0.45) {
            const species = ["crow", "seagull", "parrot"][Math.floor(Math.random() * 3)];
            state.birds.push({
              x: width + 70,
              y: groundY - 245 - Math.random() * 75,
              species,
              hasPooped: false,
              poopAtX: p.x + 110 + Math.random() * 140,
            });
            sound.playBirdCall(species);
          } else {
            const breed = ["dachshund", "poodle", "stbernard"][Math.floor(Math.random() * 3)];
            state.dogs.push({
              x: width + 80,
              y: groundY,
              breed,
              poopTimer: 0,
              hasPooped: false,
            });
            sound.playDogBark(breed);
          }
          state.spawnTimer = Math.max(1.9, 3.4 - progressRatio * 0.85) + Math.random() * 1.25;
        }
        // Spawna halkiga bananskal på marken (glesare för lugnare tempo och aldrig precis efter en sjö)
        const nearOrAfterLake = state.lakes.some((l) => width + 90 > l.x - 160 && width + 90 < l.x + l.width + 380);
        state.bananaTimer -= dt;
        if (state.bananaTimer <= 0 && !state.candyKiosk && !nearOrAfterLake) {
          state.bananaPeels.push({
            x: width + 90,
            y: groundY,
            slipped: false,
          });
          state.bananaTimer = 7.8 + Math.random() * 4.5;
        }

        // Sjöns första och sista 500 px är alltid ankfria så det garanterat
        // går att ta sig förbi i både början och slutet. Ankor spawnar bara
        // djupt i mittenzonen (650 px marginal) så de hinner alltid passera
        // spelaren innan de drivits in i start-zonen och rensas bort.
        const LAKE_DUCK_PADDING = 500;
        const DUCK_SPAWN_BUFFER = 650;
        state.duckTimer -= dt;
        const spawnWorldX = Math.max(width + 70, p.x + 900);
        const lakeAtSpawn = state.lakes.find(
          (l) => spawnWorldX > l.x + DUCK_SPAWN_BUFFER && spawnWorldX < l.x + l.width - DUCK_SPAWN_BUFFER
        );
        const tooCloseToBottomCrab = state.crabs.some((c) => c.inWater && Math.abs(c.homeX - spawnWorldX) < 250);
        if (state.duckTimer <= 0 && lakeAtSpawn && !tooCloseToBottomCrab && !state.candyKiosk) {
          state.rubberDucks.push({
            x: spawnWorldX,
            y: groundY + 4,
            hit: false,
          });
          state.duckTimer = 2.0 + Math.random() * 1.0;
        }

        // Rensa ankor som drivit in i start- eller slutzonen av sjön.
        for (let i = state.rubberDucks.length - 1; i >= 0; i--) {
          const dx = state.rubberDucks[i].x;
          const lake = state.lakes.find((l) => dx >= l.x && dx <= l.x + l.width);
          if (lake) {
            const lc = dx - lake.x;
            if (lc < LAKE_DUCK_PADDING || lc > lake.width - LAKE_DUCK_PADDING) {
              state.rubberDucks.splice(i, 1);
            }
          }
        }

        // Uppdatera badankor i sjön
        for (let i = state.rubberDucks.length - 1; i >= 0; i--) {
          const duck = state.rubberDucks[i];
          duck.x -= currentSpeed * 1.08 * dt;

          const headTopY = p.y - 38;
          if (!duck.hit && state.inLake && Math.abs(duck.x - (p.x + 18)) < 34 && headTopY <= groundY + 22) {
            duck.hit = true;
            p.stumbleTimer = 0.75;
            sound.playQuack();
            p.speechText = "🦆⬇️🌊";
            p.speechTimer = 1.3;
            spawnParticles(duck.x, groundY, "#ffd166", 12, false);
          }

          if (duck.x < -90) state.rubberDucks.splice(i, 1);
        }

        // Uppdatera snälla sjöhästar i sjön
        for (let i = state.seahorses.length - 1; i >= 0; i--) {
          const sh = state.seahorses[i];
          sh.x -= currentSpeed * dt;

          if (!sh.greeted && state.inLake && Math.abs(sh.x - p.x) < 48 && Math.abs(sh.y - (p.y - 16)) < 46) {
            sh.greeted = true;
            state.stars += 2;
            document.getElementById("starCount").textContent = state.stars;
            sound.playStar();
            p.speechText = "💖⭐+2";
            p.speechTimer = 1.3;
            spawnParticles(sh.x, sh.y - 18, "#ff8fab", 14, true);
            spawnParticles(sh.x, sh.y - 18, "#ffd166", 10, true);
          }

          if (sh.x < -100) state.seahorses.splice(i, 1);
        }

        // Uppdatera bananskal
        for (let i = state.bananaPeels.length - 1; i >= 0; i--) {
          const peel = state.bananaPeels[i];
          peel.x -= currentSpeed * dt;

          if (
            !peel.slipped &&
            p.isGrounded &&
            !state.inLake &&
            p.skateboardTimer <= 0 &&
            p.rainbowFartTimer <= 0 &&
            Math.abs(peel.x - p.x) < 28
          ) {
            peel.slipped = true;
            p.slipTimer = 1.65;
            p.slipPhase = "flip";
            p.vy = -540;
            p.isGrounded = false;
            p.spinDir = -1;
            p.spinAngle = -0.01;
            sound.playBanana();
            if (p.balloons > 0 && p.flyTimer <= 0) {
              const lostIdx = p.balloons - 1;
              const lostColor = ["#ff595e", "#ffd166", "#4cc9f0"][lostIdx % 3];
              p.balloons--;
              document.getElementById("balloonCount").textContent = `${p.balloons}/3`;
              state.escapedBalloons.push({ x: p.x + 14, y: p.y - 170, color: lostColor, wobble: Math.random() * 6 });
              p.speechText = "🍌🎈💨";
            } else {
              p.speechText = "🍌🔄";
            }
            p.speechTimer = 1.3;
            spawnParticles(peel.x, peel.y - 6, "#ffd166", 12, false);
          }

          if (peel.x < -90) state.bananaPeels.splice(i, 1);
        }

        // Uppdatera krabborna (både på stranden före sjön och nere på sjöbotten!)
        const lakeDepth = Math.min(130, (height - groundY) * 0.72);
        for (let i = state.crabs.length - 1; i >= 0; i--) {
          const crab = state.crabs[i];
          crab.homeX -= currentSpeed * dt;
          crab.x = crab.homeX + Math.sin(state.wobbleTime * (crab.inWater ? 2.4 : 3.2)) * (crab.inWater ? 26 : 32);
          crab.y = crab.inWater ? groundY + lakeDepth - 4 : groundY;

          const crabHit = crab.inWater
            ? state.inLake && Math.abs(crab.x - p.x) < 34 && Math.abs(crab.y - p.y) < 34
            : p.isGrounded && !state.inLake && Math.abs(crab.x - p.x) < 30;

          if (!crab.pinched && crabHit && p.skateboardTimer <= 0 && p.rainbowFartTimer <= 0) {
            crab.pinched = true;
            p.crabSlowTimer = 2.4;
            p.stumbleTimer = 0.55;
            sound.playCrabPinch();
            if (p.balloons > 0 && p.flyTimer <= 0) {
              const lostIdx = p.balloons - 1;
              const lostColor = ["#ff595e", "#ffd166", "#4cc9f0"][lostIdx % 3];
              p.balloons--;
              document.getElementById("balloonCount").textContent = `${p.balloons}/3`;
              state.escapedBalloons.push({ x: p.x + 14, y: p.y - 170, color: lostColor, wobble: Math.random() * 6 });
              p.speechText = "🦀🎈💨";
            } else {
              p.speechText = crab.inWater ? "🦀⬆️🌊" : "🦀🐢";
            }
            p.speechTimer = 1.5;
            spawnParticles(crab.x, crab.y - 14, "#ff595e", 12, false);
          }

          if (crab.x < -100) state.crabs.splice(i, 1);
        }

        // Uppdatera tappade ballonger som flyger upp i skyn
        for (let i = state.escapedBalloons.length - 1; i >= 0; i--) {
          const eb = state.escapedBalloons[i];
          eb.wobble += dt * 5;
          eb.y -= 175 * dt;
          eb.x += Math.sin(eb.wobble) * 45 * dt - currentSpeed * 0.25 * dt;
          if (eb.y < -120) state.escapedBalloons.splice(i, 1);
        }

        // Uppdatera hundar
        for (let i = state.dogs.length - 1; i >= 0; i--) {
          const dog = state.dogs[i];
          if (!dog.hasPooped && dog.x < width * 0.68 && dog.x > p.x + 120) {
            dog.poopTimer += dt;
            if (dog.poopTimer >= 0.45) {
              dog.hasPooped = true;
              const fartStyle = dog.breed === "stbernard" ? "tuba" : dog.breed === "dachshund" ? "squeak" : "normal";
              sound.playFart(fartStyle);
              state.poops.push({ x: dog.x + 24, y: groundY, vy: 0, fromBird: false, hit: false });
              spawnParticles(dog.x + 24, groundY - 12, "#936639", 8, false);
            }
          } else {
            dog.x -= currentSpeed * 1.15 * dt;
          }
          if (dog.x < -120) state.dogs.splice(i, 1);
        }

        // Uppdatera fåglar
        for (let i = state.birds.length - 1; i >= 0; i--) {
          const bird = state.birds[i];
          bird.x -= currentSpeed * 1.28 * dt;
          if (!bird.hasPooped && bird.x <= bird.poopAtX) {
            bird.hasPooped = true;
            sound.playFart("squeak");
            state.poops.push({ x: bird.x, y: bird.y + 12, vy: 280, fromBird: true, hit: false });
          }
          if (bird.x < -100) state.birds.splice(i, 1);
        }

        // Spawna stjärnor (eller godis i Godislandet!), ballonger, skateboard, paraply & prutt-äpplen
        state.starTimer -= dt;
        if (state.starTimer <= 0 && !state.candyKiosk) {
          const spawnOverLake = state.lakes.some((l) => width + 60 > l.x - 140 && width + 60 < l.x + l.width + 140);
          const worldId = WORLDS[state.worldIndex].id;
          const isCandyland = worldId === "candyland";
          const isUnicornWorld = worldId === "unicorn";
          const roll = Math.random();
          let itemType = isCandyland ? "candy" : "star";
          let itemY = groundY - (Math.random() < 0.45 ? 160 : 42);
          let color =
            isCandyland || isUnicornWorld
              ? ["#ff595e", "#ff758f", "#4cc9f0", "#c77dff", "#ffd166"][Math.floor(Math.random() * 5)]
              : "#ffd166";
          const candyKind = Math.random() < 0.5 ? "lollipop" : "wrapped";

          if (p.flyTimer > 0) {
            itemType = isCandyland ? "candy" : "star";
            itemY = groundY - 210 - Math.random() * 55;
          } else if (spawnOverLake) {
            itemType = isCandyland ? "candy" : "star";
            itemY = groundY + 45 + Math.random() * 55;
          } else if (roll < 0.21 && p.balloons < 3) {
            itemType = "balloon";
            itemY = groundY - 155;
            color = ["#ff595e", "#ffd166", "#4cc9f0"][p.balloons % 3];
          } else if (roll < 0.27 && p.skateboardTimer <= 0) {
            itemType = "skateboard";
            itemY = groundY - 36;
          } else if (roll < 0.3 && p.umbrellaTimer <= 0) {
            itemType = "umbrella";
            itemY = groundY - 95;
          } else if (roll < 0.35 && p.rainbowFartTimer <= 0) {
            itemType = "apple";
            itemY = groundY - 46;
          }

          state.collectibles.push({
            x: width + 60,
            y: itemY,
            type: itemType,
            candyKind,
            color,
          });
          state.starTimer = p.flyTimer > 0 ? 0.52 : 1.45 + Math.random() * 0.75;
        }

        // Uppdatera insamlingsbara föremål
        for (let i = state.collectibles.length - 1; i >= 0; i--) {
          const item = state.collectibles[i];
          item.x -= currentSpeed * dt;

          if (Math.abs(item.x - p.x) < 42 && Math.abs(item.y - (p.y - 42)) < 48) {
            if (item.type === "balloon") {
              p.balloons = Math.min(3, p.balloons + 1);
              document.getElementById("balloonCount").textContent = `${p.balloons}/3`;
              sound.playPop();
              spawnParticles(item.x, item.y, item.color || "#ff595e", 12, false);
              if (p.balloons >= 3) {
                p.flyTimer = 5.4;
                p.vy = -220;
                sound.playBalloon();
                p.speechText = "🎈🎈🎈⬆️";
                p.speechTimer = 1.4;
              } else {
                p.speechText = `🎈 ${p.balloons}/3`;
                p.speechTimer = 0.9;
              }
            } else if (item.type === "skateboard") {
              p.skateboardTimer = 6.2;
              p.slipTimer = 0;
              sound.playStar();
              p.speechText = "🛹💥💩";
              p.speechTimer = 1.3;
              spawnParticles(item.x, item.y, "#ff9f1c", 15, false);
            } else if (item.type === "umbrella") {
              p.umbrellaTimer = 8.0;
              p.umbrellaDirt = 0;
              sound.playStar();
              p.speechText = "☂️✨";
              p.speechTimer = 1.3;
              spawnParticles(item.x, item.y, "#9b5de5", 15, false);
            } else if (item.type === "apple") {
              p.rainbowFartTimer = 3.6;
              state.stars += 3;
              document.getElementById("starCount").textContent = state.stars;
              sound.playFart("tuba");
              p.speechText = "🌈💨 +3";
              p.speechTimer = 1.3;
              spawnParticles(item.x, item.y, "#80ed99", 16, false);
            } else if (item.type === "candy") {
              state.stars += 1;
              document.getElementById("starCount").textContent = state.stars;
              sound.playStar();
              spawnParticles(item.x, item.y, item.color || "#ff758f", 12, false);
            } else {
              state.stars += 1;
              document.getElementById("starCount").textContent = state.stars;
              sound.playStar();
              spawnParticles(item.x, item.y, "#ffd166", 10, false);
            }
            state.collectibles.splice(i, 1);
            continue;
          }
          if (item.x < -70) state.collectibles.splice(i, 1);
        }

        // Uppdatera bajs & kollisioner
        for (let i = state.poops.length - 1; i >= 0; i--) {
          const poop = state.poops[i];
          if (poop.fromBird) {
            poop.y += poop.vy * dt;
            poop.x -= currentSpeed * 0.25 * dt;

            // Paraplyet fångar upp fågelbajs ovanifrån och blir smutsigt!
            if (p.umbrellaTimer > 0 && Math.abs(poop.x - (p.x + 12)) < 36 && Math.abs(poop.y - (p.y - 102)) < 24) {
              p.umbrellaDirt++;
              sound.playPop();
              p.speechText = "☂️🛡️💩";
              p.speechTimer = 1.1;
              spawnParticles(poop.x, poop.y, "#ffffff", 10, false);
              state.poops.splice(i, 1);
              continue;
            }

            // Fågelbajs löses upp vid vattenytan i sjön
            const inAnyLake = state.lakes.some((l) => poop.x > l.x && poop.x < l.x + l.width);
            if (inAnyLake && poop.y >= groundY) {
              spawnParticles(poop.x, groundY, "#ffffff", 6, false);
              state.poops.splice(i, 1);
              continue;
            }
            if (poop.y >= groundY) {
              poop.y = groundY;
              poop.fromBird = false;
            }
          } else {
            poop.x -= currentSpeed * dt;
          }

          const dx = Math.abs(poop.x - p.x);
          const playerTop = p.y - (p.isDucking ? 46 : 78);
          const dyOverlaps = poop.y - 18 < p.y && poop.y > playerTop;

          if (!poop.hit && dx < 32 && dyOverlaps) {
            if (p.skateboardTimer > 0) {
              poop.hit = true;
              sound.playPop();
              state.stars += 1;
              document.getElementById("starCount").textContent = state.stars;
              p.speechText = "🛹💥 +1";
              p.speechTimer = 0.9;
              spawnParticles(poop.x, poop.y - 16, "#936639", 16, true);
              state.poops.splice(i, 1);
              continue;
            } else if (p.balloons > 0 && p.flyTimer <= 0) {
              // Det kostar en ballong att träffa bajs!
              poop.hit = true;
              p.balloons = Math.max(0, p.balloons - 1);
              document.getElementById("balloonCount").textContent = `${p.balloons}/3`;
              sound.playPop();
              p.speechText = "💥🎈💩";
              p.speechTimer = 1.2;
              spawnParticles(p.x + 10, p.y - 95, "#ff595e", 14, true);
              state.poops.splice(i, 1);
              continue;
            } else if (p.rainbowFartTimer <= 0) {
              poop.hit = true;
              p.stumbleTimer = 0.85;
              p.slipTimer = 0;
              sound.playOops();
              p.speechText = "🤢💩";
              p.speechTimer = 1.2;
              spawnParticles(poop.x, poop.y - 12, "#7f4f24", 14, true);
            }
          }

          if (poop.x < -80) state.poops.splice(i, 1);
        }

        // Uppdatera partiklar
        for (let i = state.particles.length - 1; i >= 0; i--) {
          const pt = state.particles[i];
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.vy += 320 * dt;
          pt.life -= dt;
          if (pt.life <= 0) state.particles.splice(i, 1);
        }
      }

      function draw() {
        const width = canvas.width;
        const height = canvas.height;
        const groundY = getGroundY(height);

        ctx.clearRect(0, 0, width, height);
        drawWorldBackground(width, height, groundY);

        for (const peel of state.bananaPeels) drawBananaPeel(peel);
        for (const sh of state.seahorses) drawSeahorse(sh);
        for (const crab of state.crabs) drawCrab(crab);
        for (const duck of state.rubberDucks) drawRubberDuck(duck);
        for (const item of state.collectibles) drawCollectible(item);
        for (const poop of state.poops) drawPoop(poop);
        for (const dog of state.dogs) drawDog(dog);
        for (const bird of state.birds) drawBird(bird);

        drawSprattelgubbe(state.player);

        for (const eb of state.escapedBalloons) {
          drawCollectible({ x: eb.x, y: eb.y, type: "balloon", color: eb.color });
        }

        for (const pt of state.particles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, pt.life * 1.5);
          ctx.fillStyle = pt.color;
          ctx.strokeStyle = "#2c2724";
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
      }

      function gameLoop(timestamp) {
        if (!state.lastTime) state.lastTime = timestamp;
        const dt = Math.min(0.05, (timestamp - state.lastTime) / 1000);
        state.lastTime = timestamp;

        update(dt);
        draw();
        updatePuppet(state.player);
        requestAnimationFrame(gameLoop);
      }

      /**
       * =========================================================================
       * 8. UI-HÄNDELSER & TANGENTBORD / PEKSKÄRM
       * =========================================================================
       */
      // Karaktärsväljaren byggs nu av initCharacterPicker() — klick-handlers
      // kopplas där per knapp.

document.querySelectorAll("#worldPicker .choice-chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#worldPicker .choice-chip").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          state.worldIndex = parseInt(btn.dataset.world, 10);
          initCloudsAndProps();
          sound.playPop();
        });
      });

      document.getElementById("startBtn").addEventListener("click", startGame);

      document.querySelectorAll(".candy-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          sound.playStar();
          startNextLevel(btn.dataset.candy);
        });
      });

      document.getElementById("worldCycleBtn").addEventListener("click", () => {
        const availableCount = state.unicornUnlocked ? WORLDS.length : WORLDS.length - 1;
        state.worldIndex = (state.worldIndex + 1) % availableCount;
        initCloudsAndProps();
        showWorldBanner();
        sound.playPop();
      });

      document.getElementById("speedBtn").addEventListener("click", (e) => {
        state.fastMode = !state.fastMode;
        e.currentTarget.textContent = state.fastMode ? "🐇" : "🐢";
        sound.playPop();
      });

      document.getElementById("muteBtn").addEventListener("click", (e) => {
        const muted = sound.toggleMute();
        e.currentTarget.textContent = muted ? "🔇" : "🔊";
      });

      document.getElementById("homeBtn").addEventListener("click", () => {
        state.mode = "START";
        document.getElementById("hudLayer").classList.add("hidden");
        document.getElementById("kioskOverlay").classList.add("hidden");
        document.getElementById("startOverlay").classList.remove("hidden");
      });

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
          e.preventDefault();
          if (!e.repeat) startJumpPress();
        } else if (e.code === "ArrowDown" || e.code === "KeyS") {
          e.preventDefault();
          setDucking(true);
        } else if (e.code === "ArrowRight" || e.code === "ArrowLeft") {
          e.preventDefault();
          state.turboScroll = true;
        }
      });

      window.addEventListener("keyup", (e) => {
        if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
          e.preventDefault();
          releaseJumpPress();
        } else if (e.code === "ArrowDown" || e.code === "KeyS") {
          setDucking(false);
        } else if (e.code === "ArrowRight" || e.code === "ArrowLeft") {
          state.turboScroll = false;
        }
      });

      // Släpp turbon om fönstret tappar fokus så den inte fastnar på.
      window.addEventListener("blur", () => {
        state.turboScroll = false;
      });

      // Klick/tryck var som helst på canvasen = hoppa. Dessutom kul feedback
      // om man träffar sol/moln/djur (ljud + partiklar), men hoppet triggas ändå.
      canvas.addEventListener("pointerdown", (e) => {
        sound.init();
        const rect = canvas.getBoundingClientRect();
        const tx = e.clientX - rect.left;
        const ty = e.clientY - rect.top;

        // Solen uppe till höger
        const sunX = canvas.width - 110;
        const sunY = 95;
        if (Math.hypot(tx - sunX, ty - sunY) < 55) {
          state.sunSmileTimer = 1.4;
          sound.playStar();
          spawnParticles(sunX, sunY, "#ffd166", 14, false);
        }
        // Molnen på himlen (släpper regndroppar & studsar!)
        for (const cloud of state.clouds) {
          if (Math.hypot(tx - cloud.x, ty - cloud.y) < 48) {
            cloud.bounceTimer = 0.6;
            sound.playPop();
            spawnParticles(cloud.x, cloud.y + 16, "#4cc9f0", 12, false);
            break;
          }
        }
        // Hundar (skäller & glada stjärnor!)
        for (const dog of state.dogs) {
          if (Math.hypot(tx - dog.x, ty - (dog.y - 25)) < 50) {
            sound.playDogBark(dog.breed);
            spawnParticles(dog.x, dog.y - 30, "#ffd166", 10, false);
            break;
          }
        }
        // Fåglar (kvittrar & fjäderpuff!)
        for (const bird of state.birds) {
          if (Math.hypot(tx - bird.x, ty - bird.y) < 44) {
            sound.playBirdCall(bird.species);
            spawnParticles(bird.x, bird.y, "#ffffff", 10, false);
            break;
          }
        }
        // Krabbor
        for (const crab of state.crabs) {
          if (Math.hypot(tx - crab.x, ty - (crab.y - 16)) < 44) {
            sound.playCrabPinch();
            spawnParticles(crab.x, crab.y - 18, "#ff595e", 10, false);
            break;
          }
        }
        // Sjöhästar
        for (const sh of state.seahorses) {
          if (Math.hypot(tx - sh.x, ty - sh.y) < 46) {
            sound.playStar();
            spawnParticles(sh.x, sh.y - 16, "#ff8fab", 12, false);
            break;
          }
        }
        // Själva sprattelgubben (glatt prutt om man klickar på honom)
        if (Math.hypot(tx - state.player.x, ty - (state.player.y - 45)) < 48) {
          sound.playFart("squeak");
          spawnParticles(state.player.x - 18, state.player.y - 32, "#80ed99", 10, false);
        }

        // Alltid: starta ett hopp. Charge/super-hopp genom att hålla intryckt.
        startJumpPress();
      });
      canvas.addEventListener("pointerup", () => releaseJumpPress());
      canvas.addEventListener("pointercancel", () => releaseJumpPress());
      canvas.addEventListener("pointerleave", () => releaseJumpPress());

      // =========================================================================
      // DEV-PANEL: justera papperskant & skugga live
      // =========================================================================
      const DEV_DEFAULTS = {
        worldScale: 1,
        playerScale: 0.55,
        playerEdge: 10,
        objectsEdge: 4.5,
        shadowOpacity: 0.5,
        shadowOffsetX: -3,
        shadowOffsetY: 0,
        softShadowOpacity: 0.06,
        softShadowOffsetX: 0.5,
        softShadowOffsetY: 3.5,
      };
      const DEV_KEY = "sprattelPaperSettings";

      function applyDevSettings(settings) {
        try {
          // Spelarens skala — skrivs direkt på .puppet-wrapper. Zoom appliceras
          // separat via body-transform nedanför.
          const wrapper = document.querySelector(".puppet-wrapper");
          if (wrapper && settings.playerScale) {
            wrapper.style.transform = `scale(${settings.playerScale})`;
            PUPPET.scale = settings.playerScale;
          }
          // Uniform zoom av hela spelet via CSS `zoom` på <html>. Zoom är en
          // layout-property så touch/klick-koordinater översätts automatiskt
          // av webbläsaren (till skillnad från transform:scale, där vi hade
          // behövt justera canvas-click-handlern).
          const S = settings.worldScale || 1;
          document.documentElement.style.zoom = S === 1 ? "" : String(S);
          PAPER.playerEdge = settings.playerEdge;
          PAPER.objectsEdge = settings.objectsEdge;
          PAPER.shadowOpacity = settings.shadowOpacity;
          PAPER.shadowOffsetX = settings.shadowOffsetX;
          PAPER.shadowOffsetY = settings.shadowOffsetY;
          PAPER.softShadowOpacity = settings.softShadowOpacity;
          PAPER.softShadowOffsetX = settings.softShadowOffsetX;
          PAPER.softShadowOffsetY = settings.softShadowOffsetY;
          // Uppdatera SVG-filtret för spelaren (namespace-säkert).
          const filter = document.getElementById("puppetPaperCutout");
          if (filter) {
            const morph = filter.getElementsByTagName("feMorphology")[0];
            if (morph) morph.setAttribute("radius", settings.playerEdge);
            const offset = filter.getElementsByTagName("feOffset")[0];
            if (offset) {
              offset.setAttribute("dx", settings.shadowOffsetX);
              offset.setAttribute("dy", settings.shadowOffsetY);
            }
            const matrices = filter.getElementsByTagName("feColorMatrix");
            if (matrices && matrices.length > 1) {
              const alpha = Math.min(1, settings.shadowOpacity * 2.2);
              matrices[1].setAttribute(
                "values",
                `0 0 0 0 0.231   0 0 0 0 0.2   0 0 0 0 0.18   0 0 0 ${alpha} 0`,
              );
            }
          }
        } catch (err) {
          console.warn("applyDevSettings:", err);
        }
      }

      function syncDevSliders(settings) {
        Object.entries(settings).forEach(([key, value]) => {
          const slider = document.getElementById(`dev-${key}`);
          const label = document.getElementById(`v-dev-${key}`);
          if (slider) slider.value = value;
          if (label) label.textContent = String(value);
        });
      }

      function loadDevSettings() {
        const settings = { ...DEV_DEFAULTS };
        try {
          const stored = localStorage.getItem(DEV_KEY);
          if (stored) Object.assign(settings, JSON.parse(stored));
        } catch (e) {}
        return settings;
      }

      function saveDevSettings(settings) {
        try {
          localStorage.setItem(DEV_KEY, JSON.stringify(settings));
        } catch (e) {}
      }

      function wireDevPanel() {
        const panel = document.getElementById("devPanel");
        const toggleBtn = document.getElementById("devToggleBtn");
        const resetBtn = document.getElementById("devResetBtn");
        if (!panel || !toggleBtn) {
          console.warn("Dev-panel saknar DOM-element", { panel, toggleBtn });
          return;
        }
        // Koppla toggle-listener FÖRST så panelen öppnas även om något
        // annat nedan skulle kasta.
        const togglePanel = () => panel.classList.toggle("visible");
        toggleBtn.addEventListener("click", togglePanel);
        document.addEventListener("keydown", (e) => {
          if ((e.key === "d" || e.key === "D") && !e.target.matches("input,textarea")) {
            togglePanel();
          }
        });

        const settings = loadDevSettings();
        applyDevSettings(settings);
        syncDevSliders(settings);

        Object.keys(DEV_DEFAULTS).forEach((key) => {
          const slider = document.getElementById(`dev-${key}`);
          const label = document.getElementById(`v-dev-${key}`);
          if (!slider) return;
          slider.addEventListener("input", () => {
            const v = parseFloat(slider.value);
            settings[key] = v;
            if (label) label.textContent = slider.value;
            applyDevSettings(settings);
            saveDevSettings(settings);
          });
        });

        if (resetBtn) {
          resetBtn.addEventListener("click", () => {
            Object.assign(settings, DEV_DEFAULTS);
            applyDevSettings(settings);
            syncDevSliders(settings);
            saveDevSettings(settings);
          });
        }

        const copyBtn = document.getElementById("devCopyBtn");
        if (copyBtn) {
          copyBtn.addEventListener("click", async () => {
            // Formatera som ett JS-objekt klart att klistra in i DEV_DEFAULTS.
            const lines = Object.keys(DEV_DEFAULTS).map(
              (key) => `  ${key}: ${settings[key]},`,
            );
            const text = `const DEV_DEFAULTS = {\n${lines.join("\n")}\n};`;
            try {
              await navigator.clipboard.writeText(text);
              copyBtn.textContent = "✓ Kopierat!";
              copyBtn.classList.add("copied");
              setTimeout(() => {
                copyBtn.textContent = "📋 Kopiera inställningar";
                copyBtn.classList.remove("copied");
              }, 1600);
            } catch (err) {
              // Fallback: visa värdena i en prompt så användaren kan kopiera manuellt.
              window.prompt("Kopiera inställningarna manuellt:", text);
            }
          });
        }
      }

      // Koppla dev-panelen direkt — skriptet ligger i slutet av body så DOM
      // är redan parsat, och vi vill inte att ett asynkront fel i window.onload
      // ska hindra toggle-knappen från att fungera.
      wireDevPanel();

      window.onload = () => {
        initCloudsAndProps();
        initCharacterPicker();
        loadPuppet(state.character);
        requestAnimationFrame(gameLoop);
      };
    </script>
  </body>
</html>
