<svg id="puppet-svg" viewBox="0 0 320 320" role="img" aria-label="Pappersklippt sprattelgubbe" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><style>.back-limb-shade { filter: brightness(0.88); } #character-side { display: none; }</style>
            <defs>
              <!-- PAPPERSKLIPP- & SKUGGFILTER -->
              <filter id="paper-layer-shadow" x="-25%" y="-25%" width="155%" height="155%">
                <feTurbulence id="cut-turb" type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="7" result="cutNoise"/>
                <feDisplacementMap id="cut-disp" in="SourceGraphic" in2="cutNoise" scale="1.2" xChannelSelector="R" yChannelSelector="G" result="roughCut"/>
                <feDropShadow id="layer-drop-shadow" in="roughCut" dx="4" dy="5" stdDeviation="1.2" flood-color="#291c12" flood-opacity="0.34"/>
              </filter>

              <filter id="paper-back-shadow" x="-25%" y="-25%" width="155%" height="155%">
                <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="11" result="cutNoise"/>
                <feDisplacementMap id="cut-disp-back" in="SourceGraphic" in2="cutNoise" scale="1.2" xChannelSelector="R" yChannelSelector="G" result="roughCut"/>
                <feDropShadow id="back-drop-shadow" in="roughCut" dx="3" dy="4" stdDeviation="1.1" flood-color="#291c12" flood-opacity="0.28"/>
              </filter>

              <filter id="decor-paper-shadow" x="-20%" y="-20%" width="145%" height="145%">
                <feDropShadow dx="3" dy="4" stdDeviation="1.1" flood-color="#2b1e14" flood-opacity="0.22"/>
              </filter>

              <!-- NEUTRALA MATERIAL-TEXTURER -->
              <pattern id="tex-paper" width="44" height="44" patternUnits="userSpaceOnUse">
                <rect width="44" height="44" fill="#f7f4ee"/>
                <path d="M0 9 L44 11 M0 27 L44 25 M12 0 L10 44" stroke="#c8beaf" stroke-width="1" opacity="0.55"/>
                <circle cx="8" cy="14" r="1.1" fill="#ffffff" opacity="0.8"/>
                <circle cx="29" cy="7" r="1.2" fill="#9e9282" opacity="0.5"/>
                <circle cx="37" cy="31" r="1.0" fill="#ffffff" opacity="0.7"/>
                <circle cx="17" cy="36" r="1.2" fill="#8f8373" opacity="0.45"/>
              </pattern>

              

              

              

              

              <!-- EGNA UPPLADDADE FOTON -->
              
              
            </defs>

            <!-- PAPPERSKLIPPT BAKGRUNDSMILJÖ (LAND) -->
            

            <!-- PAPPERSKLIPPT VATTEN (BAKOM FIGUREN VID SIMNING) -->
            

            <!-- Skarp pappersskugga på marken -->
            

            <!-- SPEGELVÄNDNINGSGRUPP (#flip-wrapper) -->
            <g id="flip-wrapper">

              <!-- Pappersklippt konfetti vid Fira / Dansa -->
              

              <!-- Pappersklippta dammoln bakom fötterna vid springning -->
              

