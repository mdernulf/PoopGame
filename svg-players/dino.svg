                    <g id="part-side-tailOrCape"><path class="part-body cut-edge" d="M140,190 Q90,200 60,260 Q105,230 145,210" fill="#48C9B0" stroke="#faf3e4" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/><path class="tex-overlay-body" d="M140,190 Q90,200 60,260 Q105,230 145,210" fill="url(#tex-paper)" opacity="0.55" style="mix-blend-mode: multiply; pointer-events: none;"/><path class="part-clothes cut-edge" d="M80,245 Q70,235 80,225 Z M110,225 Q100,215 110,205 Z" fill="#F7DC6F" stroke="#faf3e4" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/><path class="tex-overlay-clothes" d="M80,245 Q70,235 80,225 Z M110,225 Q100,215 110,205 Z" fill="url(#tex-paper)" opacity="0.55" style="mix-blend-mode: multiply; pointer-events: none;"/></g>
                  </g>

